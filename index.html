<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<meta name="description" content="Harlington School EPQ (AQA 7993): all 38 teaching weeks of 2026-27 for the Year 13 November, Year 13 June and Year 12 routes.">
<meta name="robots" content="noindex">
<title>EPQ Week by Week</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;0,6..72,600;1,6..72,400&family=Source+Sans+3:ital,wght@0,400;0,500;0,600;0,700;1,400&family=IBM+Plex+Mono:wght@400;500;600&display=swap">

<style>
/* ---------------------------------------------------------------
   Weekly page template. Neutral ground + structure live here;
   track accents and every word come from the manifest.
   --------------------------------------------------------------- */
:root{
  --bg:#FBF7EE; --surface:#FFFFFF; --surface-2:#F4EFE2; --surface-3:#EDE6D5;
  --ink:#1A2333; --ink-2:#48536A; --ink-3:#7C859A;
  --rule:#E3DAC6; --rule-2:#CEC3A8;
  --navy:#12294D; --gold:#C9A227; --gold-ink:#8A6D12;
  --danger:#A62016; --danger-bg:#FAEAE7; --danger-rule:#E8C2BB;
  --shadow:0 1px 2px rgba(26,35,51,.06), 0 8px 24px -16px rgba(26,35,51,.28);
  --track:#12294D; --track-bg:#EDE6D5; --track-rule:#CEC3A8;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0E1420; --surface:#161E2C; --surface-2:#1C2738; --surface-3:#243044;
    --ink:#EBE5D7; --ink-2:#B2BBCA; --ink-3:#7E8899;
    --rule:#2A3547; --rule-2:#3B4759;
    --navy:#9DB6DA; --gold:#D9B84A; --gold-ink:#D9B84A;
    --danger:#F09184; --danger-bg:#2C1714; --danger-rule:#4C2620;
    --shadow:0 1px 2px rgba(0,0,0,.4), 0 10px 28px -18px rgba(0,0,0,.8);
  }
}
:root[data-theme="dark"]{
  --bg:#0E1420; --surface:#161E2C; --surface-2:#1C2738; --surface-3:#243044;
  --ink:#EBE5D7; --ink-2:#B2BBCA; --ink-3:#7E8899;
  --rule:#2A3547; --rule-2:#3B4759;
  --navy:#9DB6DA; --gold:#D9B84A; --gold-ink:#D9B84A;
  --danger:#F09184; --danger-bg:#2C1714; --danger-rule:#4C2620;
  --shadow:0 1px 2px rgba(0,0,0,.4), 0 10px 28px -18px rgba(0,0,0,.8);
}
*{box-sizing:border-box}
body{
  margin:0; background:var(--bg); color:var(--ink);
  font-family:"Source Sans 3","Segoe UI",system-ui,sans-serif;
  font-size:16px; line-height:1.55; -webkit-font-smoothing:antialiased;
}
a{color:var(--track); text-underline-offset:2px}
.wrap{max-width:1080px;margin:0 auto;padding:0 20px}

/* ---------- masthead ---------- */
.mast{border-bottom:2px solid var(--rule-2);background:var(--surface-2)}
.mast .wrap{padding-top:34px;padding-bottom:26px}
.crest{display:flex;align-items:baseline;gap:10px;font-family:"IBM Plex Mono",ui-monospace,monospace;
  font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--ink-3)}
.crest b{color:var(--gold-ink);font-weight:600}
h1{font-family:Newsreader,Georgia,serif;font-weight:500;font-size:clamp(30px,5.2vw,48px);
  line-height:1.06;margin:12px 0 8px;letter-spacing:-.015em;text-wrap:balance;color:var(--ink)}
.standfirst{max-width:62ch;color:var(--ink-2);font-size:17px;margin:0}
.hint{margin:14px 0 0;font-size:13.5px;color:var(--ink-3);max-width:62ch}
.hint b{color:var(--gold-ink);font-weight:600}
.facts{display:flex;flex-wrap:wrap;gap:0;margin-top:20px;border-top:2px solid var(--rule-2)}
.fact{padding:12px 22px 10px 0;margin-right:22px;border-right:2px solid var(--rule)}
.fact:last-child{border-right:0}
.fact dt{font-family:"IBM Plex Mono",monospace;font-size:10px;letter-spacing:.14em;
  text-transform:uppercase;color:var(--ink-3);margin:0 0 3px}
.fact dd{margin:0;font-size:15px;font-weight:600;font-variant-numeric:tabular-nums}

/* ---------- toolbar ---------- */
.bar{position:sticky;top:0;z-index:40;background:var(--surface);
  border-bottom:2px solid var(--rule-2);box-shadow:0 1px 0 rgba(0,0,0,.02)}
.bar .wrap{display:flex;flex-wrap:wrap;gap:14px;align-items:center;padding-top:10px;padding-bottom:10px}
.tabs{display:flex;gap:6px;flex-wrap:wrap}
.tab{appearance:none;cursor:pointer;border:2px solid var(--rule-2);background:transparent;
  color:var(--ink-2);border-radius:2px;padding:7px 13px;font:inherit;font-size:14px;
  font-weight:600;display:flex;align-items:center;gap:8px;transition:background .12s,border-color .12s,color .12s}
.tab .dot{width:9px;height:9px;border-radius:50%;background:currentColor;opacity:.45}
.tab:hover{background:var(--surface-2)}
.tab[aria-selected="true"]{background:var(--track-bg);border-color:var(--track);color:var(--track)}
.tab[aria-selected="true"] .dot{opacity:1}
.tab .n{font-family:"IBM Plex Mono",monospace;font-size:11px;opacity:.7;font-weight:500}
.spacer{flex:1 1 40px}
.seg{display:inline-flex;border:2px solid var(--rule-2);border-radius:2px;overflow:hidden}
.seg button{appearance:none;cursor:pointer;border:0;background:transparent;color:var(--ink-2);
  font:inherit;font-size:13px;font-weight:600;padding:7px 12px}
.seg button + button{border-left:2px solid var(--rule-2)}
.seg button[aria-pressed="true"]{background:var(--navy);color:var(--surface)}
.btn{appearance:none;cursor:pointer;border:2px solid var(--rule-2);background:transparent;
  color:var(--ink-2);border-radius:2px;padding:7px 12px;font:inherit;font-size:13px;font-weight:600}
.btn:hover{background:var(--surface-2)}
.meter{display:flex;align-items:center;gap:9px;font-family:"IBM Plex Mono",monospace;
  font-size:11px;color:var(--ink-3);letter-spacing:.04em}
.meter .track-bar{width:88px;height:5px;background:var(--surface-3);border-radius:3px;overflow:hidden}
.meter .fill{height:100%;background:var(--track);width:0;transition:width .25s}
button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible{
  outline:2px solid var(--gold);outline-offset:2px}

/* ---------- track intro ---------- */
.intro{background:var(--track-bg);border-bottom:2px solid var(--track-rule)}
.intro .wrap{padding:20px 20px 22px;display:grid;grid-template-columns:1fr auto;gap:24px;align-items:start}
.intro h2{font-family:Newsreader,Georgia,serif;font-weight:500;font-size:23px;margin:0 0 6px;color:var(--track)}
.intro p{margin:0;max-width:64ch;color:var(--ink-2);font-size:15px}
.spine{display:flex;flex-direction:column;gap:5px;min-width:210px}
.spine .row{display:flex;justify-content:space-between;gap:16px;font-size:13px;
  padding:5px 0;border-bottom:2px dotted var(--track-rule)}
.spine .row:last-child{border-bottom:0}
.spine .k{color:var(--ink-2)}
.spine .v{font-family:"IBM Plex Mono",monospace;font-weight:600;color:var(--track);
  font-variant-numeric:tabular-nums;white-space:nowrap}

/* ---------- weeks ---------- */
main{padding:26px 0 70px}
.termhead{display:flex;align-items:center;gap:14px;margin:34px 0 14px;scroll-margin-top:108px}
.termhead:first-child{margin-top:6px}
.termhead h3{font-family:"IBM Plex Mono",monospace;font-size:11px;letter-spacing:.18em;
  text-transform:uppercase;color:var(--ink-3);margin:0;white-space:nowrap;font-weight:600}
.termhead .line{flex:1;height:2px;background:var(--rule-2)}

.wk{scroll-margin-top:108px;background:var(--surface);border:2px solid var(--rule-2);border-radius:3px;
  margin-bottom:10px;box-shadow:var(--shadow);overflow:hidden}
.wk.deadline{border-color:var(--danger-rule)}
.wk .inner{display:grid;grid-template-columns:158px 1fr;gap:0}
.idx{padding:16px 16px 16px 18px;border-right:2px solid var(--rule-2);background:var(--surface-2)}
.wk.deadline .idx{background:var(--danger-bg);border-right-color:var(--danger-rule)}
.idx .num{font-family:"IBM Plex Mono",monospace;font-size:11px;letter-spacing:.14em;
  text-transform:uppercase;color:var(--ink-3);font-weight:600}
.idx .date{font-family:Newsreader,Georgia,serif;font-size:21px;line-height:1.15;margin-top:2px;color:var(--ink)}
.idx .days{font-family:"IBM Plex Mono",monospace;font-size:11px;color:var(--ink-3);margin-top:3px;
  font-variant-numeric:tabular-nums}
.idx .note{font-size:12px;color:var(--ink-2);margin-top:8px;font-style:italic;line-height:1.35}
.wlink{appearance:none;cursor:pointer;border:0;background:transparent;padding:0;margin-top:10px;
  font-family:"IBM Plex Mono",monospace;font-size:10px;letter-spacing:.1em;text-transform:uppercase;
  font-weight:600;color:var(--ink-3);border-bottom:2px solid var(--rule-2);line-height:1.7}
.wlink:hover{color:var(--track);border-bottom-color:var(--track)}
.wlink[data-done="1"]{color:var(--track);border-bottom-color:var(--track)}
.wurl{display:none;width:100%;margin-top:7px;font-family:"IBM Plex Mono",monospace;font-size:10.5px;
  padding:5px 6px;border:2px solid var(--rule-2);border-radius:2px;background:var(--surface);
  color:var(--ink-2)}
.wurl.show{display:block}
.wk.flash{border-color:var(--gold)}
.wk.flash .idx{background:var(--surface-3)}
.body{padding:15px 18px 16px}
.phase{display:inline-block;font-family:"IBM Plex Mono",monospace;font-size:10px;
  letter-spacing:.13em;text-transform:uppercase;font-weight:600;color:var(--track);
  background:var(--track-bg);border:2px solid var(--track-rule);border-radius:2px;padding:3px 7px}
.flag{display:inline-block;font-family:"IBM Plex Mono",monospace;font-size:10px;
  letter-spacing:.13em;text-transform:uppercase;font-weight:600;color:var(--danger);
  background:var(--danger-bg);border:2px solid var(--danger-rule);border-radius:2px;padding:3px 7px;margin-left:6px}
h4.wt{font-family:Newsreader,Georgia,serif;font-weight:600;font-size:20px;margin:9px 0 2px;
  letter-spacing:-.01em;text-wrap:balance}
.lede{margin:0 0 12px;color:var(--ink-2);font-size:15px;max-width:68ch}
.slots{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:0;
  border:2px solid var(--rule-2);border-radius:2px;margin-bottom:13px}
.slot{padding:10px 13px;display:flex;flex-direction:column}
.slot + .slot{border-left:2px solid var(--rule-2)}
.slot dt{font-family:"IBM Plex Mono",monospace;font-size:10px;letter-spacing:.12em;
  text-transform:uppercase;color:var(--ink-3);font-weight:600;margin-bottom:3px}
.slot dd{margin:0;font-size:14.5px;color:var(--ink)}
.slinks{margin-top:auto;padding-top:10px;display:flex;flex-wrap:wrap;gap:6px}
.slink{display:inline-flex;align-items:center;gap:5px;text-decoration:none;font-size:13px;
  font-weight:600;color:var(--track);background:var(--track-bg);
  border:2px solid var(--track-rule);border-radius:2px;padding:4px 9px 4px 7px;
  transition:border-color .12s,background .12s}
.slink:hover{border-color:var(--track)}
.slink .ar{font-size:10px;opacity:.65;line-height:1}

/* ---------- media ---------- */
.media{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 12px}
.mbtn{appearance:none;cursor:pointer;font:inherit;font-size:13px;font-weight:600;
  display:inline-flex;align-items:center;gap:7px;padding:5px 11px 5px 9px;border-radius:2px;
  color:var(--gold-ink);background:transparent;border:2px solid var(--gold);
  transition:background .12s}
.mbtn:hover{background:var(--surface-2)}
.mbtn[aria-expanded="true"]{background:var(--gold);color:#1A2333}
.mbtn .gl{font-size:11px;line-height:1}
.mbtn .by{font-size:12px;opacity:.72;font-weight:500}
.mbtn .by:before{content:"· "}
.mbtn .mins{font-family:"IBM Plex Mono",monospace;font-size:10.5px;opacity:.75;font-weight:500}
.mstage{margin:0 0 13px}
.mstage[hidden]{display:none}
.mstage .frame{position:relative;width:100%;aspect-ratio:16/9;border:2px solid var(--rule-2);
  border-radius:2px;overflow:hidden;background:#000}
.mstage .frame iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.mstage audio{width:100%;display:block}

.tasks{list-style:none;margin:0 0 4px;padding:0;display:flex;flex-direction:column;gap:3px}
.tasks li{display:flex;gap:10px;align-items:flex-start;padding:4px 0;font-size:15px}
.tasks input{margin:4px 0 0;accent-color:var(--track);width:15px;height:15px;flex:none;cursor:pointer}
.tasks label{cursor:pointer}
.tasks li.checked label{color:var(--ink-3);text-decoration:line-through}
.subhead{font-family:"IBM Plex Mono",monospace;font-size:10px;letter-spacing:.13em;
  text-transform:uppercase;color:var(--ink-3);font-weight:600;margin:12px 0 4px}
.logbox{border-left:4px solid var(--gold);background:var(--surface-2);padding:8px 12px;
  font-size:14.5px;margin:10px 0 0;color:var(--ink-2)}
.logbox b{color:var(--ink);font-weight:600}
.links{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}
.chip{display:inline-flex;align-items:center;gap:6px;text-decoration:none;font-size:13px;
  font-weight:600;color:var(--ink-2);background:var(--surface-2);border:2px solid var(--rule);
  border-radius:2px;padding:4px 9px;transition:border-color .12s,color .12s}
.chip:hover{border-color:var(--track);color:var(--track)}
.chip .ext{font-family:"IBM Plex Mono",monospace;font-size:9px;letter-spacing:.1em;
  color:var(--ink-3);border:2px solid var(--rule-2);border-radius:2px;padding:1px 3px}
.sup{border-top:2px dashed var(--rule-2);margin-top:14px;padding-top:11px;display:none}
body[data-view="sup"] .sup{display:block}
.sup .subhead{color:var(--gold-ink);margin-top:0}
.sup p{margin:0 0 6px;font-size:14.5px;color:var(--ink-2)}
.qa{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.qa span{font-family:"IBM Plex Mono",monospace;font-size:10.5px;letter-spacing:.06em;
  color:var(--gold-ink);border:2px solid var(--gold);border-radius:2px;padding:2px 7px;background:transparent}

.brk{display:flex;align-items:center;gap:14px;margin:14px 0;padding:9px 16px;
  background:repeating-linear-gradient(135deg,transparent 0 7px,var(--surface-2) 7px 14px);
  border:2px solid var(--rule-2);border-radius:3px}
.brk .lbl{font-family:"IBM Plex Mono",monospace;font-size:11px;letter-spacing:.14em;
  text-transform:uppercase;font-weight:600;color:var(--ink-2);white-space:nowrap}
.brk .dt{font-family:"IBM Plex Mono",monospace;font-size:12px;color:var(--ink-3);
  font-variant-numeric:tabular-nums;white-space:nowrap}
.brk .msg{font-size:14px;color:var(--ink-2);font-style:italic}
.brk.warn{background:var(--danger-bg);border-color:var(--danger-rule)}
.brk.warn .lbl,.brk.warn .dt{color:var(--danger)}

.endcap{border:2px solid var(--track-rule);background:var(--track-bg);border-radius:3px;
  padding:20px 22px;margin-top:18px}
.endcap h4{font-family:Newsreader,Georgia,serif;font-weight:600;font-size:21px;margin:0 0 6px;color:var(--track)}
.endcap p{margin:0 0 8px;color:var(--ink-2);font-size:15px;max-width:66ch}
.endcap ul{margin:6px 0 0;padding-left:20px;color:var(--ink-2);font-size:15px}
.endcap li{margin-bottom:3px}

.lib{border-top:2px solid var(--rule-2);margin-top:44px;padding-top:30px}
.lib h3{font-family:Newsreader,Georgia,serif;font-weight:500;font-size:26px;margin:0 0 4px}
.lib > p{margin:0 0 20px;color:var(--ink-2);max-width:66ch;font-size:15px}
.shelves{display:grid;grid-template-columns:repeat(auto-fit,minmax(272px,1fr));gap:14px}
.shelf{border:2px solid var(--rule-2);border-radius:3px;background:var(--surface);padding:14px 16px}
.shelf h5{font-family:"IBM Plex Mono",monospace;font-size:10px;letter-spacing:.14em;
  text-transform:uppercase;color:var(--ink-3);margin:0 0 9px;font-weight:600}
.shelf ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:5px}
.shelf a{display:block;font-size:14.5px;text-decoration:none;color:var(--ink);
  border-bottom:2px dotted var(--rule);padding-bottom:6px}
.shelf li:last-child a{border-bottom:0}
.shelf a:hover{color:var(--track)}
.shelf a .t{font-family:"IBM Plex Mono",monospace;font-size:9.5px;color:var(--ink-3);margin-left:6px;
  letter-spacing:.08em}
.gap{margin-top:16px;border:2px dashed var(--rule-2);border-radius:3px;padding:12px 15px;
  font-size:14px;color:var(--ink-2)}
.gap b{color:var(--ink)}
.gap[hidden]{display:none}
footer{border-top:2px solid var(--rule-2);margin-top:40px;padding:20px 0 40px;
  font-size:13px;color:var(--ink-3)}
footer .wrap{display:flex;flex-wrap:wrap;gap:16px;justify-content:space-between}

@media (max-width:720px){
  .wk .inner{grid-template-columns:1fr}
  .idx{border-right:0;border-bottom:2px solid var(--rule-2);display:flex;align-items:baseline;
    gap:10px;flex-wrap:wrap;padding:11px 16px}
  .wk.deadline .idx{border-bottom-color:var(--danger-rule)}
  .idx .date{font-size:18px;margin-top:0}
  .idx .note{width:100%;margin-top:2px}
  .intro .wrap{grid-template-columns:1fr}
  .slot + .slot{border-left:0;border-top:2px solid var(--rule-2)}
  .fact{padding-right:16px;margin-right:16px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>

<header class="mast"><div class="wrap">
  <div class="crest" id="crest"></div>
  <h1 id="pageTitle"></h1>
  <p class="standfirst" id="standfirst"></p>
  <dl class="facts" id="facts"></dl>
  <p class="hint" id="hint"></p>
</div></header>

<div class="bar"><div class="wrap">
  <div class="tabs" id="tabs" role="tablist" aria-label="Track"></div>
  <div class="spacer"></div>
  <div class="meter"><span id="mcount">0 / 0</span><span class="track-bar"><span class="fill" id="mfill"></span></span></div>
  <div class="seg" role="group" aria-label="View">
    <button id="vStu" aria-pressed="true"></button>
    <button id="vSup" aria-pressed="false"></button>
  </div>
  <button class="btn" id="today"></button>
</div></div>

<div class="intro"><div class="wrap">
  <div><h2 id="introTitle"></h2><p id="introText"></p></div>
  <div class="spine" id="introSpine"></div>
</div></div>

<main class="wrap" id="weeks"></main>

<div class="wrap">
  <section class="lib">
    <h3 id="libTitle"></h3>
    <p id="libLede"></p>
    <div class="shelves" id="shelves"></div>
    <div class="gap" id="gapBox" hidden></div>
  </section>
</div>

<footer><div class="wrap" id="foot"></div></footer>
