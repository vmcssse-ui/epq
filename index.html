,"weeks":{"nov":{"1":{"p":"Gate week","t":"Return audit and the September baseline","f":"Route decision","l":"First week back, with two jobs in one: establish exactly what Year 1 left you with, and test it against the four criteria that decide who can realistically sit November.","w":"Programme launch — the three routes, the two documents, and what changes now the supervisor of record is one person. Then Unit 1 at speed and 1.2 Language of Level 3 Titles: every title is re-tested, including the ones you thought were settled.","c":"1:1 audit interview. Bring the draft, the log book and the source list.","wl":["u1","s12"],"cl":["lb13"],"k":["Bring the AQA Production Log and every file from Year 1 to the first session.","Complete the Return Audit sheet: current title, log book sections finished, number of sources, draft word count.","Submit your current full draft, however rough, before the conference.","Re-state your title using the Level 3 wording tests — or defend the one you have.","List every source with one line saying what it does for the argument."],"g":"Log book: complete any unfinished section up to and including the Mid Project Review. This is the audit's second criterion and the most common failure point.","r":["u1","s12","nA1","lb13","us13"],"s":"Issue the Return Audit sheet on day one and open a row per student on the Student Tracker sheet. Score each against the four gate criteria. A provisional allocation is enough this week; confirm in week 2 once the draft has been read properly. Anyone missing two or more criteria goes to June — say so plainly rather than letting hope carry them into October.","q":["Tracker: baseline recorded","Route: provisional"],"video":{"url":"https://www.youtube.com/watch?v=1YIfN4rAhiE","label":"Getting an A* in the EPQ","by":"Martin Blyth","title":"Secrets to EPQ Success: How to get an A* in your Extended Project Qualification (AQA)","mins":"13:31"},"podcast":null},"2":{"p":"Gap analysis","t":"Route confirmed, gaps named","f":null,"l":"With the route fixed, the rest of the term is a repair job on a known list of gaps. Specialist referrals open this week.","w":"Unit 6 Realisation and Review — what a finished project actually looks like — followed by 6.1 Synthesis Not Summary.","c":"Section-by-section gap analysis of your draft against AO3.","wl":["u6","s61"],"cl":["nA34"],"k":["Build a gap map: every section of the draft, what it currently does, what it must do.","Submit a specialist referral request naming the one question a subject specialist could answer.","Convert two summarising paragraphs into synthesising ones using the deck's phrase bank."],"g":"Decisions Log: record the route decision and the reasoning behind it. Examiners credit the reasoning, not the outcome.","r":["u6","s61","nA34"],"s":"Referral round 1 goes out this week (w/c 14 Sep). Send specialists the question, not the project — they give research feedback only, set no deadlines and do no marking. Open the Specialist Feedback sheet for each student.","q":["Referral round 1 issued","Specialist Feedback sheet open"],"video":{"url":"https://www.youtube.com/watch?v=hrD3-s84Qhc","label":"Structuring the EPQ essay","by":"Mr Davey","title":"How to write your EPQ essay","mins":"4:48"},"podcast":null},"3":{"p":"AO4","t":"Evaluation — the fifth of the marks nobody writes","f":null,"l":"AO4 is twenty per cent and is where returning drafts are thinnest, because evaluation is written last and usually written as apology.","w":"6.3 Writing Evaluation That Scores — WEAK/STRONG pairs, then the decisions your evaluation has to account for.","c":"Evaluation planning conference. Bring your Decisions Log.","wl":["s63"],"cl":["lb13"],"k":["Draft the evaluation section, 600–800 words, using the deck's sentence stems.","List the five decisions that most changed the project — each becomes an evaluation paragraph.","Identify one thing you would do differently and say precisely why, not that you would 'manage time better'."],"g":"Log book: supervisor conference record signed for this week's meeting.","r":["s63","nA34","lb13"],"s":"Log book check point 1 of four. Read for evidence of decision-making across time, not neatness. Record the check on the Student Tracker sheet.","q":["Log book check 1","Conference recorded"],"video":{"url":"https://www.youtube.com/watch?v=AwfWoqo3LhA","label":"Completing the evaluation","by":"Martin Blyth","title":"EPQ Secrets: Production Log Series - Completing the Evaluation","mins":"7:02"},"podcast":null},"4":{"p":"Presentation build","t":"Building the presentation","f":"Deck due Fri 2 Oct","l":"The presentation is assessed and it is next week. This week it gets built and rehearsed to time.","w":"6.2 The Presentation — structure, timing, and handling the question you were hoping nobody would ask.","c":"Rehearsal slot. Full run to time, no notes.","wl":["s62"],"cl":["s62"],"k":["Build the deck: 8–10 slides, no read-aloud text.","Rehearse to time at least twice — the clock is part of the assessment.","Write three questions you would least like to be asked, and your answers.","Record round 1 specialist feedback in the log book and state what you did about it."],"g":"Specialist Feedback record: what was advised, what you decided, why. Advice you never act on earns nothing.","r":["s62","lb13"],"s":"Confirm the panel and book the room for next week. Feedback returning this week must be recorded before the presentation — unrecorded advice is invisible to the moderator.","q":["Panel confirmed","Referral 1 returned"],"video":{"url":"https://www.youtube.com/watch?v=5PNyS2hqpU8","label":"Delivering the EPQ presentation","by":"CompSciByteSize","title":"6. How to do your EPQ presentation","mins":"4:36"},"podcast":null},"5":{"p":"Assessed","t":"Presentations","f":"Presentations w/c 5 Oct","l":"You deliver to the panel, take questions, and complete the Production Log presentation record the same day while it is fresh.","w":"Presentations — delivery and audience questions.","c":"Post-presentation debrief: what the questions revealed, and the final revisions list.","wl":["s62"],"cl":["lb13"],"k":["Deliver the presentation to the panel.","Complete Production Log presentation record parts A and B on the day.","Fold at least one panel question into the evaluation section."],"g":"Production Log: presentation record completed and signed. AQA requires it — an unsigned record costs marks that were genuinely earned in the room.","r":["s62","lb13"],"s":"Sign every presentation record on the day. Capture AO4 evidence in the tracker while the delivery is fresh. Debrief immediately: the questions students could not answer are the revision list for next week.","q":["Presentation records signed","AO4 evidence captured"],"video":{"url":"https://www.youtube.com/watch?v=5PNyS2hqpU8","label":"Delivering the EPQ presentation","by":"CompSciByteSize","title":"6. How to do your EPQ presentation","mins":"4:36"},"podcast":null},"6":{"p":"Submission","t":"Reference audit and submission","f":"HARD · Student submission Fri 16 Oct","l":"Final week in the student's hands. Everything is checked, declared and handed in by Friday.","w":"Unit 5 Referencing and Integrity with 5.1 Referencing by Source Type — a live audit of your own bibliography.","c":"Final read-through with the supervisor.","wl":["u5","s51"],"cl":["nRF"],"k":["Audit every in-text citation against the bibliography, and every bibliography entry against the text.","Sign the integrity and AI declaration.","Complete the log book to its final section, including the last conference record.","Submit the project, the log book and the presentation record by Friday 16 October."],"g":"Everything. The log book is finished this week — it is submitted alongside the project, not after it.","r":["u5","s51","nRF","lb13"],"s":"Collect on Friday and check completeness the same afternoon — a missing signature found on Monday is recoverable, one found in half term is not.","q":["Submission collected","Declarations signed"],"video":{"url":"https://www.youtube.com/watch?v=8_SxY2jpRFc","label":"Academic integrity and plagiarism","by":"HumberEDU","title":"Academic Integrity | Plagiarism: One Form of Academic Misconduct","mins":"3:56"},"podcast":null},"7":{"p":"Centre","t":"Marking and standardisation","f":"HARD · All work complete Fri 23 Oct","l":"No student work this week. Marking, internal standardisation and centre paperwork all finish before the two-week break, because AQA's deadline lands inside it.","w":"No taught session for this route — students join the June-route workshop as observers or step into the mentoring rota.","c":"Available for administrative queries only.","wl":[],"cl":[],"k":["Respond to any queries from the supervisor within 24 hours.","Do not submit new or revised work — the project is closed."],"g":"Closed.","r":["trk","sow"],"s":"Mark, standardise internally with a second reader, and complete centre paperwork by Friday 23 October. The AQA deadline of Thursday 5 November falls inside half term, so nothing can be left to the week after. Confirm the entry with the exams officer before the break.","q":["Marking complete","Internal standardisation","Exams officer confirmed"],"video":null,"podcast":null},"8":{"p":"Complete","t":"Route complete","f":null,"l":"The centre submission is made over half term. From here these three students are done — and become the programme's most useful teaching resource.","w":"Join the unified cohort workshop.","c":"Mentoring rota — paired with a June-route or Year 12 student.","wl":[],"cl":[],"k":["Take one mentoring session per fortnight and keep a short record of it.","Write a 300-word reflection on the November route for next year's cohort."],"g":"Closed — but keep the mentoring record. It is genuine evidence for personal statements and references.","r":["sow"],"s":"Set the mentoring rota. Debrief the route while it is fresh: what the gate criteria caught, what they missed, and whether three was the right number. Feed it into the scheme of work review.","q":["Rota set","Route review logged"],"video":null,"podcast":null}},"jun":{"1":{"p":"Gate week","t":"Return audit and the September baseline","f":"Route decision","l":"The same audit as the November route, read differently: what a June-route student needs now is a defensible question, not a finished draft.","w":"Programme launch — the three routes and the two documents — then Unit 1 at speed and 1.2 Language of Level 3 Titles, shared with the November route.","c":"Independent research and reading. Conference access opens in week 5.","wl":["u1","s12"],"cl":["lb13"],"k":["Bring the AQA Production Log and everything from Year 1 to the first session.","Complete the Return Audit sheet: title, log book state, source count, draft word count.","Re-test your title against the Level 3 wording criteria and rewrite it if it fails.","Write one paragraph on what you would change if you started again — it becomes this year's plan."],"g":"Log book in the room every week from now on, with every unfinished section brought up to date to the end of the aims and objectives pages.","r":["u1","s12","nA1","lb13","us13"],"s":"Same audit sheet as the November route — the gate criteria differ, not the evidence. Open tracker rows for all nine Year 13 students together and confirm the June allocation. The 50-minute session carries the differentiation this half term: November route gets conference priority, June route gets protected research time.","q":["Tracker: baseline recorded","Route: confirmed"],"video":{"url":"https://www.youtube.com/watch?v=1YIfN4rAhiE","label":"Getting an A* in the EPQ","by":"Martin Blyth","title":"Secrets to EPQ Success: How to get an A* in your Extended Project Qualification (AQA)","mins":"13:31"},"podcast":null},"2":{"p":"Unit 1","t":"Re-anchoring the question","f":null,"l":"A year of runway is only useful if the question is worth a year. This week it is rebuilt from the topic up.","w":"1.1 From Topic to Question, then 1.3 Aims, Objectives and the Monthly Page.","c":"Independent research; drop-in available.","wl":["s11","s13"],"cl":["lb13"],"k":["Re-run the topic-to-question journey and document it — the journey is what AO1 credits.","Write one aim and three to five objectives that are individually tickable.","Set up monthly planning pages for September through April."],"g":"Aims and objectives pages, and the first monthly planning page.","r":["s11","s13","nA1","lb13"],"s":"Referral round 1 goes out (w/c 14 Sep). Specialists answer a question; they do not read the project. Open the Specialist Feedback sheet.","q":["Referral round 1 issued"],"video":{"url":"https://www.youtube.com/watch?v=71-GucBaM8U","label":"Building a strong research question","by":"Scribbr","title":"How to Develop a STRONG Research Question","mins":"4:19"},"podcast":null},"3":{"p":"Unit 2","t":"Which sources actually survive","f":null,"l":"Most returning source lists are longer than they are useful. This week separates the sources that carry the argument from the ones that were merely found.","w":"Unit 2 Using Resources, then 2.1 Interrogating a Source.","c":"Independent research; drop-in available.","wl":["u2","s21"],"cl":["nA2"],"k":["Apply the five tests to every Year 1 source and mark each keep, replace or discard.","Find three new sources of a type you have not yet used.","Justify one discard in writing — deletions are decisions and they score."],"g":"Decisions Log: the source cull and its reasoning.","r":["u2","s21","nA2"],"s":"Watch for students who cannot discard anything — usually a symptom of a question too broad to discriminate. Flag them for a title conversation in week 5.","q":[],"video":{"url":"https://www.youtube.com/watch?v=p18Y6zAB84o","label":"Five ways to find academic sources","by":"Presenting Psychology","title":"Obtaining academic sources: five reliable methods","mins":"7:58"},"podcast":null},"4":{"p":"Unit 2","t":"Building the Source Analysis Document","f":null,"l":"The Source Analysis Document is where AO2 lives. Built properly now, it writes half the project in February.","w":"2.2 Building the Source Analysis Document — the worked example, column by column.","c":"Independent research; drop-in available.","wl":["s22"],"cl":["lb13"],"k":["Build the document and populate it with your eight strongest sources.","For each, record what it claims, how it knows, and where it disagrees with another source.","Note the two sources that most disagree — that disagreement is your analysis."],"g":"Source Analysis section of the companion logbook, started properly.","r":["s22","nA2","lb13"],"s":"Check the documents in week 5 conferences. A row that only summarises the source is the standard failure — push for the 'how it knows' column.","q":[],"video":{"url":"https://www.youtube.com/watch?v=zIYC6zG265E","label":"What a literature review does","by":"Scribbr","title":"How to Write a Literature Review: 3 Minute Step-by-step Guide","mins":"3:05"},"podcast":null},"5":{"p":"Unit 3","t":"Conference access opens","f":null,"l":"The November route's conference priority ends here; from this week the June route has weekly contact and starts turning sources into data.","w":"Unit 3 Extracting and Analysing Data — what counts as data when your sources are texts.","c":"First full 1:1 conference. Bring the Source Analysis Document.","wl":["u3"],"cl":["s22"],"k":["Bring the Source Analysis Document to conference and take notes on the challenge you get.","Identify what your data actually is, in one sentence.","Begin preparing for the Mid Project Review in week 7."],"g":"Supervisor conference record — first of the fortnightly minimum.","r":["u3","nEX","lb13"],"s":"Conference rota starts. Fortnightly minimum per student, recorded in the log book's supervisor section and on the tracker.","q":["Conference rota live"],"video":{"url":"https://www.youtube.com/watch?v=rNulPTwLFMQ","label":"Choosing an analysis strategy","by":"Scribbr","title":"Research Design: Decide on your Data Analysis Strategy","mins":"3:03"},"podcast":null},"6":{"p":"Unit 3","t":"Coding frames","f":null,"l":"A coding frame is how a pile of reading becomes something you can make a claim about.","w":"3.1 Coding Frames in Practice — build one on shared material, then on your own.","c":"Independent research; drop-in available.","wl":["s31"],"cl":["nEX"],"k":["Build a coding frame with four to six categories for your own material.","Apply it to three sources and record what the frame missed.","Draft your Mid Project Review statement for next week."],"g":"Coding frame pasted into the log book with a note on why these categories.","r":["s31","nEX"],"s":"Frames with fifteen categories are frames that have not been thought about. Push for fewer, better-defended categories.","q":[],"video":{"url":"https://www.youtube.com/watch?v=g6DkPanv76Q","label":"Coding data with Braun & Clarke","by":"Degree Doctor","title":"Coding qualitative data - how to code using Braun and Clarke","mins":"9:07"},"podcast":null},"7":{"p":"Checkpoint","t":"Mid Project Review","f":"MPR before half term","l":"The formal halfway point in AQA's own terms: what has changed, what you now think, and what the rest of the year does.","w":"MPR workshop — writing a review that shows judgement rather than progress.","c":"Mid Project Review conference, 1:1, recorded.","wl":["lb13"],"cl":["lb13"],"k":["Complete the Mid Project Review section of the Production Log.","State the one thing that has changed most since September and what caused it.","Set three objectives for the two-week break."],"g":"Mid Project Review — the single most heavily weighted log book entry of the autumn.","r":["lb13","nA1","trk"],"s":"Log book check 2 of four. Sign every MPR. Issue the half-term reading brief: five sources into the Source Analysis Document, no new writing.","q":["Log book check 2","MPR signed","Break brief issued"],"video":{"url":"https://www.youtube.com/watch?v=pRfmI11F3GA","label":"The Mid Project Review","by":"Martin Blyth","title":"EPQ Secrets: Production Log Series - Mid Project Review","mins":"9:03"},"podcast":null},"8":{"p":"Unit 4","t":"Do you need primary data at all?","f":null,"l":"The cohort unifies this week. First question of the second half: is primary data genuinely necessary, or would it just be work?","w":"Unit 4 Primary Data and Ethics — when primary data earns its place, and when it does not.","c":"Route decision conference: primary or secondary only.","wl":["u4"],"cl":["nDA"],"k":["Decide, in writing, whether your project needs primary data, and defend the decision either way.","If yes, sketch what you would collect and from whom.","Record round 1 specialist feedback and your response to it."],"g":"Decisions Log: the primary data decision. Deciding against it, well argued, scores as highly as doing it.","r":["u4","nDA","lb13"],"s":"Unified workshop from this week — a single block plus a rotating conference schedule. Resist students taking primary data for prestige; ethics approval costs weeks they may not have.","q":["Cohort unified","Referral 1 recorded"],"video":{"url":"https://www.youtube.com/watch?v=3pjilybtP8g","label":"The four ethical considerations","by":"Grad Coach","title":"What Are RESEARCH ETHICS? The 4 Ethical Considerations","mins":"8:56"},"podcast":null},"9":{"p":"Unit 4 / 3","t":"Instruments, or other media","f":null,"l":"The cohort splits by need: those collecting primary data design their instrument, the rest widen what counts as a source.","w":"4.1 Designing Questions That Work, running alongside 3.2 Analysing Images, Music and Video.","c":"1:1 conference.","wl":["s41","s32"],"cl":["nDA"],"k":["Primary data: draft your instrument and pilot it on two people.","Secondary only: analyse one non-text source using the 3.2 framework.","Either way, record why this method and not another."],"g":"Method section of the log book, drafted.","r":["s41","s32","nDA"],"s":"Pilot everything. An unpiloted questionnaire is the single most common source of unusable Year 13 data.","q":[],"video":{"url":"https://www.youtube.com/watch?v=Iq_fhTuY1hw","label":"Seven tips for survey questions","by":"Elon University Poll","title":"7 tips for good survey questions","mins":"4:02"},"podcast":null},"10":{"p":"Fieldwork","t":"Ethics approval and collection window","f":null,"l":"If you are collecting, this is when it happens — and it happens under an approved ethics statement, not around one.","w":"Ethics in practice: consent, anonymity, withdrawal, and data storage.","c":"1:1 conference — ethics sign-off.","wl":["u4"],"cl":["lb13"],"k":["Submit your ethics statement for sign-off before collecting anything.","Collect data within this window only.","Secondary route: complete the coding of your full source set."],"g":"Ethics statement, signed by the supervisor before any collection.","r":["u4","nDA","lb13"],"s":"Referral round 2 issued. No collection begins without a signed ethics statement — this is the one place where the supervisor role is a gate, not support.","q":["Referral round 2 issued","Ethics signed off"],"video":{"url":"https://www.youtube.com/watch?v=3pjilybtP8g","label":"The four ethical considerations","by":"Grad Coach","title":"What Are RESEARCH ETHICS? The 4 Ethical Considerations","mins":"8:56"},"podcast":null},"11":{"p":"Unit 5","t":"Referencing before writing, not after","f":null,"l":"Reference management set up now costs an hour. Set up in April it costs a weekend and some marks.","w":"Unit 5 Referencing and Integrity, then 5.1 Referencing by Source Type.","c":"1:1 conference.","wl":["u5","s51"],"cl":["nRF"],"k":["Choose a referencing system and set up a reference list for every source you hold.","Reference the five hardest source types you are using.","Read and sign the integrity and AI section of the companion logbook."],"g":"Integrity and AI declaration — the working version, signed again at submission.","r":["u5","s51","nRF","lb13"],"s":"Point students at the school AI governance rules in the companion logbook. Make the declaration a working document now rather than a signature in April.","q":[],"video":{"url":"https://www.youtube.com/watch?v=8_SxY2jpRFc","label":"Academic integrity and plagiarism","by":"HumberEDU","title":"Academic Integrity | Plagiarism: One Form of Academic Misconduct","mins":"3:56"},"podcast":null},"12":{"p":"Writing","t":"Writing block 1 — introduction and context","f":null,"l":"Writing starts here, and it starts with the section you can already argue.","w":"Structuring an introduction that states a question rather than a topic.","c":"1:1 conference.","wl":["s61"],"cl":["lb13"],"k":["Draft the introduction: question, why it matters, what you will do.","Draft the context or literature section from the Source Analysis Document.","Bring 1,200 words to conference, however unfinished."],"g":"Monthly planning page for December, with word targets.","r":["s61","lb13"],"s":"Insist on words on paper this week. Students who postpone the first draft section until January do not recover the time.","q":[],"video":{"url":"https://www.youtube.com/watch?v=9hnIkyZrbos","label":"Combining sources, not listing them","by":"Academic Bites","title":"Synthesising: How to Combine Your Sources in Academic Writing","mins":"4:10"},"podcast":null},"13":{"p":"Writing","t":"Section 1 due","f":"Section 1 due Fri 18 Dec","l":"The first assessed-quality section is handed in before the break, and the break has a brief.","w":"Peer review against the AO2 criteria, then revision time.","c":"1:1 conference — section 1 feedback.","wl":["nA2"],"cl":["lb13"],"k":["Submit introduction and context, referenced, by Friday 18 December.","Complete the termly AO self-audit in the companion logbook.","Christmas brief: read the three sources you have been avoiding and code them."],"g":"Termly AO self-audit — all four assessment objectives, honestly scored.","r":["nA2","lb13","trk"],"s":"Issue the Christmas brief in writing. Read the submitted sections over the break only if you will return them in week 14 — unreturned work teaches students that deadlines are decorative.","q":["Section 1 collected","Break brief issued"],"video":null,"podcast":null},"14":{"p":"Writing","t":"Writing block 2 — analysis begins","f":null,"l":"Back from the break and straight into the section that carries the most marks.","w":"Turning coded material into an argued analysis section.","c":"1:1 conference — section 1 returned with feedback.","wl":["s61"],"cl":["nA34"],"k":["Read the feedback on section 1 and write a revision plan before revising anything.","Draft the first analysis section, 800–1,000 words.","Record in the Decisions Log what you changed and why."],"g":"Decisions Log: response to section 1 feedback.","r":["u3","s61","nA34"],"s":"Return section 1 with feedback this week. Feedback given more than a fortnight after submission is not feedback, it is commentary.","q":["Section 1 returned"],"video":{"url":"https://www.youtube.com/watch?v=9hnIkyZrbos","label":"Combining sources, not listing them","by":"Academic Bites","title":"Synthesising: How to Combine Your Sources in Academic Writing","mins":"4:10"},"podcast":null},"15":{"p":"Analysis","t":"Your own material, your own frame","f":null,"l":"The coding frame built in October meets the material you have actually gathered.","w":"3.1 and 3.2 revisited — applying the frame to your own data, including images, music or video.","c":"1:1 conference.","wl":["s31","s32"],"cl":["nEX"],"k":["Apply your coding frame to the full data set.","Report one finding that surprised you and what you did about it.","Revise the frame if it does not fit — and record the revision."],"g":"Data analysis pages, with the revised frame.","r":["s31","s32","nEX"],"s":"Surprise is the marker of genuine analysis. Students who report that everything confirmed their expectations are usually describing, not analysing.","q":[],"video":{"url":"https://www.youtube.com/watch?v=g6DkPanv76Q","label":"Coding data with Braun & Clarke","by":"Degree Doctor","title":"Coding qualitative data - how to code using Braun and Clarke","mins":"9:07"},"podcast":null},"16":{"p":"Writing","t":"Writing block 3","f":null,"l":"Analysis continues. Specialist feedback returns for the last time this year, so there is still time to act on it.","w":"Argument architecture — making each analysis section answer part of the question.","c":"1:1 conference.","wl":["s61"],"cl":["nA34"],"k":["Complete the second analysis section.","Submit your final specialist referral question.","Map each section to the part of the question it answers — cut anything that maps to nothing."],"g":"Specialist Feedback record.","r":["s61","nA34","lb13"],"s":"Referral round 3 — the last one. Make clear to students that advice arriving in March is advice they will not have time to use.","q":["Referral round 3 issued"],"video":{"url":"https://www.youtube.com/watch?v=9hnIkyZrbos","label":"Combining sources, not listing them","by":"Academic Bites","title":"Synthesising: How to Combine Your Sources in Academic Writing","mins":"4:10"},"podcast":null},"17":{"p":"Unit 6","t":"Synthesis, not summary","f":null,"l":"The difference between a project that reports its reading and one that argues from it.","w":"6.1 Synthesis Not Summary — the WEAK/STRONG pairs, applied to your own paragraphs.","c":"1:1 conference.","wl":["s61","u6"],"cl":["lb13"],"k":["Rewrite three summarising paragraphs as synthesising ones.","Draft the conclusion in outline — one sentence per move.","Check every claim has a source and every source has a job."],"g":"Nothing new — but the log book must be current before the full draft in two weeks.","r":["s61","u6","nA34"],"s":"This is the highest-leverage single session of the spring. Book the room where students can spread paper out.","q":[],"video":{"url":"https://www.youtube.com/watch?v=9hnIkyZrbos","label":"Combining sources, not listing them","by":"Academic Bites","title":"Synthesising: How to Combine Your Sources in Academic Writing","mins":"4:10"},"podcast":null},"18":{"p":"Writing","t":"Writing block 4 — conclusion and assembly","f":null,"l":"Every section exists. This week they become one document.","w":"Assembly: contents, section transitions, and the conclusion that answers the actual question.","c":"1:1 conference.","wl":["s61"],"cl":["nRF"],"k":["Draft the conclusion in full.","Assemble the complete document with contents and consistent formatting.","Run a full reference check before submitting the draft."],"g":"Monthly planning page for February.","r":["s61","nRF"],"s":"Confirm the draft deadline in writing and tell students what a 'full draft' means: every section present, referenced, no placeholders.","q":[],"video":{"url":"https://www.youtube.com/watch?v=9hnIkyZrbos","label":"Combining sources, not listing them","by":"Academic Bites","title":"Synthesising: How to Combine Your Sources in Academic Writing","mins":"4:10"},"podcast":null},"19":{"p":"Checkpoint","t":"Full draft due","f":"HARD · Full draft Fri 12 Feb","l":"The whole project, complete and referenced, in the supervisor's hands before half term.","w":"Final assembly time in the room.","c":"1:1 conference — draft handover.","wl":["lb13"],"cl":["trk"],"k":["Submit the full draft by Friday 12 February.","Complete the termly AO self-audit.","Half term: rest. No new writing is set."],"g":"Log book complete to the end of the drafting sections; termly AO self-audit done.","r":["lb13","trk","nA34"],"s":"Log book check 3 of four. Read drafts over half term and return them in week 20 — this is the one break where supervisor work is unavoidable if the March presentations are to be worth anything.","q":["Log book check 3","Drafts collected"],"video":null,"podcast":null},"20":{"p":"Revision","t":"Draft feedback conferences","f":null,"l":"The draft comes back annotated. What matters is not the annotations but the plan you write in response.","w":"Reading feedback like an examiner: what is a fix, what is a rethink.","c":"Extended 1:1 conference — full draft feedback.","wl":["nA34"],"cl":["lb13"],"k":["Write a revision plan before making a single edit.","Rank the changes by mark impact, not by ease.","Record the plan in the Decisions Log."],"g":"Decisions Log: the revision plan, dated.","r":["lb13","nA34","trk"],"s":"Give every student a face-to-face feedback conference this week even if it costs the workshop block. Written feedback alone under-serves the weakest drafts.","q":["All drafts returned"],"video":null,"podcast":null},"21":{"p":"AO4","t":"Revision block and evaluation","f":null,"l":"Revision runs alongside the evaluation, because the evaluation is about the decisions the revision is now proving.","w":"6.3 Writing Evaluation That Scores.","c":"1:1 conference.","wl":["s63"],"cl":["lb13"],"k":["Work through the revision plan, top-ranked changes first.","Draft the evaluation, 800–1,000 words, from the Decisions Log.","Evaluate the method, not your feelings about the workload."],"g":"Evaluation draft pasted or referenced in the log book.","r":["s63","nA34","lb13"],"s":"Evaluations that apologise score badly; evaluations that weigh alternatives score well. Use the deck's WEAK/STRONG pairs directly in the room.","q":[],"video":{"url":"https://www.youtube.com/watch?v=AwfWoqo3LhA","label":"Completing the evaluation","by":"Martin Blyth","title":"EPQ Secrets: Production Log Series - Completing the Evaluation","mins":"7:02"},"podcast":null},"22":{"p":"Presentation build","t":"Building the presentation","f":"Deck due Fri 12 Mar","l":"Assessed presentations are next week. This week the deck is built and rehearsed to time.","w":"6.2 The Presentation — structure, timing, question handling.","c":"Rehearsal slot, full run to time.","wl":["s62"],"cl":["s62"],"k":["Build the deck: 8–10 slides, no read-aloud text.","Rehearse to time at least twice.","Prepare answers to the three questions you least want."],"g":"Presentation plan section of the companion logbook.","r":["s62","lb13"],"s":"Confirm the panel and rooming. Invite a colleague from outside RE onto the panel — unfamiliar questioners produce better AO4 evidence.","q":["Panel confirmed"],"video":{"url":"https://www.youtube.com/watch?v=5PNyS2hqpU8","label":"Delivering the EPQ presentation","by":"CompSciByteSize","title":"6. How to do your EPQ presentation","mins":"4:36"},"podcast":null},"23":{"p":"Assessed","t":"Presentations","f":"Presentations w/c 15 Mar","l":"Delivered to the panel, with the Production Log record completed the same day.","w":"Presentations — delivery and audience questions.","c":"Post-presentation debrief and final revisions list.","wl":["s62"],"cl":["lb13"],"k":["Deliver the presentation.","Complete Production Log presentation record parts A and B on the day.","Add at least one panel question to the evaluation."],"g":"Production Log presentation record, completed and signed.","r":["s62","lb13"],"s":"Sign records on the day. Capture AO4 evidence in the tracker immediately after each delivery.","q":["Presentation records signed","AO4 evidence captured"],"video":{"url":"https://www.youtube.com/watch?v=5PNyS2hqpU8","label":"Delivering the EPQ presentation","by":"CompSciByteSize","title":"6. How to do your EPQ presentation","mins":"4:36"},"podcast":null},"24":{"p":"Revision","t":"Post-presentation revisions","f":null,"l":"Last week of term. The panel's questions become the final revision list, and the reference audit begins.","w":"Final revisions clinic.","c":"1:1 conference — final revisions agreed.","wl":["nRF"],"cl":["lb13"],"k":["Complete the revisions arising from the presentation.","Begin the full reference and bibliography audit.","Easter brief: finish revisions, do not start anything new."],"g":"Supervisor conference record; revision list closed.","r":["nRF","s51","lb13"],"s":"Issue the Easter brief in writing with a word limit on new material — ideally zero. Easter rewrites are how good projects become incoherent ones.","q":["Easter brief issued"],"video":null,"podcast":null},"25":{"p":"Final","t":"Polish, references, declarations","f":null,"l":"Three weeks to submission. Everything from here is checking, not writing.","w":"Reference audit clinic and formatting standards.","c":"1:1 conference.","wl":["u5","s51"],"cl":["lb13"],"k":["Audit every citation against the bibliography and back again.","Proofread aloud — it catches what silent reading does not.","Complete and sign the integrity and AI declaration."],"g":"Integrity and AI declaration, final version.","r":["u5","s51","nRF","lb13"],"s":"Check declarations against the school AI governance rules. Any student whose account of AI use has changed since December needs a conversation, not a form.","q":[],"video":{"url":"https://www.youtube.com/watch?v=8_SxY2jpRFc","label":"Academic integrity and plagiarism","by":"HumberEDU","title":"Academic Integrity | Plagiarism: One Form of Academic Misconduct","mins":"3:56"},"podcast":null},"26":{"p":"Submission","t":"Student submission","f":"HARD · Student submission Fri 23 Apr","l":"Project, log book and presentation record all hand in together by Friday.","w":"Final completeness check in the room, against a printed checklist.","c":"1:1 conference — final sign-off.","wl":["lb13"],"cl":["trk"],"k":["Complete the final checklist in the companion logbook.","Ensure every log book section is signed, including the last conference record.","Submit by Friday 23 April."],"g":"Log book finished. It submits with the project, not after it.","r":["lb13","trk"],"s":"Log book check 4 of four. Check completeness on the day of collection.","q":["Log book check 4","Submission collected"],"video":null,"podcast":null},"27":{"p":"Centre","t":"Marking and standardisation","f":"Internal deadline Fri 30 Apr","l":"No student work. Marking, internal standardisation and centre records complete by Friday.","w":"No session — study leave preparation.","c":"Administrative queries only.","wl":[],"cl":[],"k":["Respond to supervisor queries within 24 hours.","No new or revised work — the project is closed."],"g":"Closed.","r":["trk","sow"],"s":"Mark and standardise with a second reader. Confirm entries with the exams officer. Retain records per the scheme of work's retention section.","q":["Marking complete","Internal standardisation","Records retained"],"video":null,"podcast":null},"28":{"p":"Complete","t":"Route complete","f":null,"l":"Year 13 EPQ is finished. What remains is the part that matters for university: knowing how to talk about it.","w":"Optional session — talking about your EPQ at interview.","c":"Available on request.","wl":["s62"],"cl":[],"k":["Write a 150-word account of the project for personal statements and interviews.","Note the one methodological thing you would tell a Year 12 starting out."],"g":"Closed.","r":["sow"],"s":"Collect the Year 12-facing reflections — they are the best recruitment material the programme has. Run the annual scheme of work review in the summer term.","q":["Route review logged"],"video":{"url":"https://www.youtube.com/watch?v=5PNyS2hqpU8","label":"Delivering the EPQ presentation","by":"CompSciByteSize","title":"6. How to do your EPQ presentation","mins":"4:36"},"podcast":null}},"y12":{"1":{"p":"Induction","t":"What you have signed up to","f":null,"l":"What an EPQ is, what it is worth, why it runs on two documents rather than one — and then the first real decision of the project.","w":"Programme induction: the qualification, the UCAS value, the five-term shape of the run. Then Unit 1 Managing the Project — the difference between a topic area and a research question.","c":"1:1 conference — topic shortlist discussion.","wl":["u1","us12"],"cl":["lb12"],"k":["Read Unit Sheet 1 and set up the Companion Logbook, including §1 on how it works alongside the AQA Production Log.","Bring a shortlist of three possible topic areas, not questions.","Justify each topic against three tests: genuine interest, access to real sources, Level 3 scope.","Discard one topic and write down why."],"g":"Decisions Log: first entry — the topic you discarded and the reason.","r":["u1","us12","lb12","sow","nA1"],"s":"Be explicit that the companion logbook supplements, never replaces, the AQA Production Log. Open tracker rows for all nine students. The first discard matters more than the first choice: it establishes that decisions get recorded. Watch for topics with no accessible sources — the most common Year 12 dead end.","q":["Tracker: rows opened"],"video":{"url":"https://www.youtube.com/watch?v=1YIfN4rAhiE","label":"Getting an A* in the EPQ","by":"Martin Blyth","title":"Secrets to EPQ Success: How to get an A* in your Extended Project Qualification (AQA)","mins":"13:31"},"podcast":null},"2":{"p":"Unit 1","t":"From topic to question","f":null,"l":"The journey from a topic you like to a question you can answer is the thing AO1 actually credits — so it has to be visible.","w":"1.1 From Topic to Question — worked examples, then your own.","c":"1:1 conference.","wl":["s11"],"cl":["lb12"],"k":["Convert each remaining topic into two candidate questions.","Record the journey: what each version fixed and what it broke.","Test each question against 'could I be wrong about this?' — if not, it is not a question."],"g":"The topic-to-question journey, in full, with the versions you rejected.","r":["s11","nA1","lb12"],"s":"Referral round 1 requests go out (w/c 14 Sep) — for Year 12 these are 'is this question viable in your subject?' rather than research questions.","q":["Referral round 1 issued"],"video":{"url":"https://www.youtube.com/watch?v=71-GucBaM8U","label":"Building a strong research question","by":"Scribbr","title":"How to Develop a STRONG Research Question","mins":"4:19"},"podcast":null},"3":{"p":"Unit 1","t":"The language of a Level 3 title","f":null,"l":"Descriptive titles cap the marks available before a word is written. This week your title stops describing.","w":"1.2 Language of Level 3 Titles — WEAK/STRONG pairs and the verbs that carry analysis.","c":"1:1 conference — provisional title fixed.","wl":["s12"],"cl":["lb12"],"k":["Rewrite your title three times using the deck's verb bank.","Fix a provisional title and record why this wording and not the others.","Check the title against the source list — can you actually answer it?"],"g":"Provisional title, with the rejected wordings beneath it.","r":["s12","nA1","lb12"],"s":"Provisional, not final — say so. Titles fixed too hard in week 4 become projects that cannot respond to what the reading turns up.","q":[],"video":{"url":"https://www.youtube.com/watch?v=bGBBJBaWqEI","label":"Descriptive vs analytical writing","by":"Grad Coach","title":"Descriptive Writing vs Critical Analytical Writing In Research","mins":"7:10"},"podcast":null},"4":{"p":"Unit 1","t":"Aims, objectives and the monthly page","f":null,"l":"An aim is what the project is for. An objective is something you can tick. Confusing the two is why projects stall in February.","w":"1.3 Aims, Objectives and the Monthly Page.","c":"1:1 conference.","wl":["s13"],"cl":["lb12"],"k":["Write one aim and three to five objectives, each individually tickable.","Set up monthly planning pages from October to July.","Fill in October's page with dates, not intentions."],"g":"Aims and objectives pages, and the first monthly planning page.","r":["s13","lb12","nA1"],"s":"Reject objectives that cannot be ticked — 'research the background' is not an objective. The chain aim → objective → tickability is the infographic to put on the board.","q":[],"video":{"url":"https://www.youtube.com/watch?v=4BTJL2GcXBc","label":"Deadlines and SMART objectives","by":"Martin Blyth","title":"EPQ Secrets: Time Management - Setting Deadlines and SMART targets","mins":"3:48"},"podcast":null},"5":{"p":"Unit 2","t":"Finding sources worth having","f":null,"l":"Eight sources, deliberately mixed in type. Finding them is easy; justifying them is the work.","w":"Unit 2 Using Resources — where Level 3 sources come from and what makes one usable.","c":"1:1 conference.","wl":["u2"],"cl":["nA2"],"k":["Find eight sources of at least four different types.","Write one line per source on what it contributes.","Identify the one source you cannot get hold of and find a route to it or a substitute."],"g":"Resource list started in the companion logbook.","r":["u2","nA2","lb12"],"s":"Log book check 1 of four. Check that aims and objectives are present and tickable before the source work builds on them.","q":["Log book check 1"],"video":{"url":"https://www.youtube.com/watch?v=p18Y6zAB84o","label":"Five ways to find academic sources","by":"Presenting Psychology","title":"Obtaining academic sources: five reliable methods","mins":"7:58"},"podcast":null},"6":{"p":"Unit 2","t":"Interrogating a source","f":null,"l":"Five tests, applied properly, to three sources. This is the habit the whole of AO2 rests on.","w":"2.1 Interrogating a Source — the five tests on shared material, then your own.","c":"1:1 conference.","wl":["s21"],"cl":["nA2"],"k":["Apply the five tests to three of your sources in writing.","Name one source that failed a test and say what you will do about it.","Find a source that disagrees with your strongest one."],"g":"Source interrogation notes for three sources.","r":["s21","nA2","lb12"],"s":"Push for the disagreeing source. Students who only collect agreement build projects with nothing to analyse.","q":[],"video":{"url":"https://www.youtube.com/watch?v=_M1-aMCJHFg","label":"Testing a source with CRAAP","by":"McMaster Libraries","title":"How Library Stuff Works: How to Evaluate Resources (the CRAAP test)","mins":"2:10"},"podcast":null},"7":{"p":"Checkpoint","t":"Title confirmed","f":"Title confirmed Fri 23 Oct","l":"Last week before the two-week break. The title is signed off and Part A of the Production Log is completed.","w":"2.2 Building the Source Analysis Document, then title sign-off clinic.","c":"1:1 conference — title sign-off.","wl":["s22"],"cl":["lb12"],"k":["Build the Source Analysis Document and enter your first five sources.","Confirm the title and complete Production Log Part A.","Half-term brief: read five sources, notes straight into the Source Analysis Document."],"g":"Production Log Part A. This is an AQA document, not a school one — it is signed.","r":["s22","lb12","trk","nA2"],"s":"Sign every title before the break. Issue the reading brief in writing — two weeks of unstructured time is the largest single block of the autumn.","q":["Titles signed","Part A complete","Break brief issued"],"video":{"url":"https://www.youtube.com/watch?v=zIYC6zG265E","label":"What a literature review does","by":"Scribbr","title":"How to Write a Literature Review: 3 Minute Step-by-step Guide","mins":"3:05"},"podcast":null},"8":{"p":"Unit 3","t":"When reading becomes data","f":null,"l":"Back from two weeks of reading with a pile of notes. This unit turns the pile into something you can make claims about.","w":"Unit 3 Extracting and Analysing Data — what counts as data when your sources are texts.","c":"1:1 conference — half-term reading reviewed.","wl":["u3"],"cl":["lb12"],"k":["Report on the five sources read over the break.","State in one sentence what your data actually is.","Record round 1 specialist feedback and what you decided in response."],"g":"Specialist Feedback record — the advice, your decision, your reasoning.","r":["u3","nEX","lb12"],"s":"Cohort unifies this week: one workshop, rotating conference schedule. Check the break brief was done — the first break sets the pattern for the rest.","q":["Cohort unified","Referral 1 recorded"],"video":{"url":"https://www.youtube.com/watch?v=rNulPTwLFMQ","label":"Choosing an analysis strategy","by":"Scribbr","title":"Research Design: Decide on your Data Analysis Strategy","mins":"3:03"},"podcast":null},"9":{"p":"Unit 3","t":"Coding frames in practice","f":null,"l":"Four to six categories, defensible, applied consistently. That is a coding frame, and it is what separates analysis from opinion.","w":"3.1 Coding Frames in Practice — build one collectively, then build your own.","c":"1:1 conference.","wl":["s31"],"cl":["nEX"],"k":["Build a coding frame with four to six categories.","Apply it to three sources and note what it failed to capture.","Revise the frame once, and record the revision."],"g":"Coding frame, with a note on why these categories and not others.","r":["s31","nEX"],"s":"Frames with too many categories are frames that have not been thought about. Insist on the revision — the second version is where the thinking shows.","q":[],"video":{"url":"https://www.youtube.com/watch?v=g6DkPanv76Q","label":"Coding data with Braun & Clarke","by":"Degree Doctor","title":"Coding qualitative data - how to code using Braun and Clarke","mins":"9:07"},"podcast":null},"10":{"p":"Unit 3","t":"Images, music and video","f":null,"l":"Not every source is a text, and the projects that use other media well tend to be the ones that stand out.","w":"3.2 Analysing Images, Music and Video.","c":"1:1 conference.","wl":["s32"],"cl":["nEX"],"k":["Analyse one non-text source using the framework from the deck.","Decide whether non-text sources belong in your project, and record the decision.","Add two more sources to the Source Analysis Document."],"g":"Decisions Log: whether and why non-text sources are in or out.","r":["s32","nEX"],"s":"For RE and humanities projects this is usually the highest-value optional session in the unit — encourage rather than require.","q":[],"video":{"url":"https://www.youtube.com/watch?v=sgUTNm2_AQU","label":"Reading a visual text","by":"Jeddle","title":"How to Analyse any Visual Text - 14 Techniques","mins":"3:08"},"podcast":null},"11":{"p":"Unit 4","t":"Primary data — and whether you need it","f":null,"l":"Primary data is impressive when it answers the question and a liability when it does not. This week you decide.","w":"Unit 4 Primary Data and Ethics — when primary data earns its place.","c":"1:1 conference — primary or secondary decision.","wl":["u4"],"cl":["nDA"],"k":["Decide in writing whether your project needs primary data.","Defend the decision either way — deciding against it scores just as well.","If yes, sketch what you would collect, from whom, and under what consent."],"g":"Decisions Log: the primary data decision, with reasoning.","r":["u4","nDA","lb12"],"s":"Log book check 2 of four. Guard against primary data chosen for prestige — ethics approval and collection cost weeks that the writing will want back.","q":["Log book check 2"],"video":{"url":"https://www.youtube.com/watch?v=3pjilybtP8g","label":"The four ethical considerations","by":"Grad Coach","title":"What Are RESEARCH ETHICS? The 4 Ethical Considerations","mins":"8:56"},"podcast":null},"12":{"p":"Unit 4","t":"Designing questions that work","f":null,"l":"Most questionnaires fail on the first pilot. That is what pilots are for, and why they happen in December and not April.","w":"4.1 Designing Questions That Work — leading questions, double-barrelled questions, and questions nobody can answer.","c":"1:1 conference.","wl":["s41"],"cl":["nDA"],"k":["Primary route: draft your instrument and pilot it on two people.","Secondary route: complete coding of your full source set instead.","Record why this method rather than the alternatives."],"g":"Method section, drafted.","r":["s41","nDA"],"s":"Pilot everything before the break. An unpiloted instrument collected in January is the classic irrecoverable Year 12 error.","q":[],"video":{"url":"https://www.youtube.com/watch?v=Iq_fhTuY1hw","label":"Seven tips for survey questions","by":"Elon University Poll","title":"7 tips for good survey questions","mins":"4:02"},"podcast":null},"13":{"p":"Checkpoint","t":"Preparing the Mid Project Review","f":"MPR statement due Fri 18 Dec","l":"Last week of term. The Mid Project Review conference is in January; the statement that drives it is written now.","w":"Writing a review that shows judgement rather than progress.","c":"1:1 conference.","wl":["lb12"],"cl":["lb12"],"k":["Draft your Mid Project Review statement: what changed, what you now think, what remains.","Complete the termly AO self-audit in the companion logbook.","Christmas brief: read four sources and code them into the frame."],"g":"Termly AO self-audit and the draft MPR statement.","r":["lb12","trk","nA1"],"s":"Issue the Christmas brief in writing with a specific source count. Book January's MPR conferences before the break so they are in students' calendars.","q":["Break brief issued","MPR conferences booked"],"video":{"url":"https://www.youtube.com/watch?v=pRfmI11F3GA","label":"The Mid Project Review","by":"Martin Blyth","title":"EPQ Secrets: Production Log Series - Mid Project Review","mins":"9:03"},"podcast":null},"14":{"p":"Checkpoint","t":"Mid Project Review","f":"MPR conference","l":"AQA's own formal halfway point. It is a conversation about judgement, recorded in the Production Log.","w":"MPR workshop, then conference slots.","c":"Mid Project Review conference, 1:1, recorded.","wl":["lb12"],"cl":["lb12"],"k":["Complete the Mid Project Review section of the Production Log.","Name the one thing that has changed most and what caused it.","Set three objectives for the spring term."],"g":"Mid Project Review — the most heavily weighted log book entry of the year so far.","r":["lb12","trk","nA1"],"s":"Sign every MPR. Referral round 2 issued this week — for Year 12 these should be method questions, which specialists answer far better than topic questions.","q":["MPR signed","Referral round 2 issued"],"video":{"url":"https://www.youtube.com/watch?v=pRfmI11F3GA","label":"The Mid Project Review","by":"Martin Blyth","title":"EPQ Secrets: Production Log Series - Mid Project Review","mins":"9:03"},"podcast":null},"15":{"p":"Unit 5","t":"Referencing and integrity","f":null,"l":"Set up before the writing starts, referencing is an hour's work. Set up afterwards, it is a weekend and some lost marks.","w":"Unit 5 Referencing and Integrity — why the bibliography is assessed and how integrity is evidenced.","c":"1:1 conference.","wl":["u5"],"cl":["nRF"],"k":["Choose a referencing system and build a reference list of everything you hold.","Read the integrity and AI section of the companion logbook.","Write your first AI-use statement — what you have used it for so far, honestly."],"g":"Integrity and AI declaration, working version.","r":["u5","nRF","lb12"],"s":"Anchor this in the school AI governance rules rather than inventing EPQ-specific ones. Honest early declarations are far easier to supervise than retrospective ones.","q":[],"video":{"url":"https://www.youtube.com/watch?v=8_SxY2jpRFc","label":"Academic integrity and plagiarism","by":"HumberEDU","title":"Academic Integrity | Plagiarism: One Form of Academic Misconduct","mins":"3:56"},"podcast":null},"16":{"p":"Unit 5","t":"Referencing by source type","f":null,"l":"The hard cases: edited collections, translations, websites without authors, images, interviews you conducted yourself.","w":"5.1 Referencing by Source Type — the anatomy of a reference, then the awkward types.","c":"1:1 conference.","wl":["s51"],"cl":["nRF"],"k":["Reference the five most awkward source types you are using.","Complete the reference list for every source in the Source Analysis Document.","Check three references against the anatomy diagram."],"g":"Complete reference list — every source you hold, correctly formatted.","r":["s51","nRF","lb12"],"s":"A complete reference list in January is the single best predictor of a calm April next year. Check it, do not just ask about it.","q":[],"video":{"url":"https://www.youtube.com/watch?v=lEgc9NV3_Gc","label":"Harvard referencing, step by step","by":"Digital Learning Consultant","title":"Simple Harvard Referencing Tutorial","mins":"6:08"},"podcast":null},"17":{"p":"Writing","t":"Writing block 1 — introduction and context","f":null,"l":"Writing starts. The introduction states a question; the context section shows what others have said about it.","w":"Structuring an introduction that states a question rather than a topic.","c":"1:1 conference.","wl":["s61"],"cl":["lb12"],"k":["Draft the introduction: question, why it matters, what you will do.","Draft the context section from the Source Analysis Document.","Bring 1,000 words to conference, however unfinished."],"g":"Monthly planning page for February, with word targets.","r":["s61","lb12"],"s":"Insist on words on paper. Year 12 students who delay the first section until the summer term arrive in Year 13 without a draft to work from.","q":[],"video":{"url":"https://www.youtube.com/watch?v=9hnIkyZrbos","label":"Combining sources, not listing them","by":"Academic Bites","title":"Synthesising: How to Combine Your Sources in Academic Writing","mins":"4:10"},"podcast":null},"18":{"p":"Writing","t":"Writing block 2 — first analysis section","f":null,"l":"The coded material becomes an argued section — the first piece of genuinely assessed-quality writing.","w":"Turning coded material into an analysis section that argues.","c":"1:1 conference.","wl":["s61"],"cl":["nA34"],"k":["Draft the first analysis section, 800–1,000 words.","Make each paragraph answer part of the question, not describe a source.","Reference as you write, not afterwards."],"g":"Decisions Log: any change of direction the writing has forced.","r":["u3","s61","nA34"],"s":"Writing surfaces the weaknesses in the question. Expect and welcome title adjustments here — record them rather than resisting them.","q":[],"video":{"url":"https://www.youtube.com/watch?v=9hnIkyZrbos","label":"Combining sources, not listing them","by":"Academic Bites","title":"Synthesising: How to Combine Your Sources in Academic Writing","mins":"4:10"},"podcast":null},"19":{"p":"Checkpoint","t":"First sections due","f":"Sections 1 & 2 due Fri 12 Feb","l":"Introduction, context and first analysis section, referenced, before half term.","w":"Peer review against the AO2 criteria, then revision time.","c":"1:1 conference — sections handed over.","wl":["nA2"],"cl":["lb12"],"k":["Submit sections 1 and 2 by Friday 12 February.","Complete the termly AO self-audit.","Half term: rest. Nothing is set."],"g":"Termly AO self-audit — all four objectives, honestly scored.","r":["lb12","trk","nA2"],"s":"Log book check 3 of four. Return the sections in week 20 — Year 12 learn deadline culture from whether yours are kept.","q":["Log book check 3","Sections collected"],"video":null,"podcast":null},"20":{"p":"Revision","t":"Section feedback","f":null,"l":"The sections come back annotated. The plan you write in response matters more than the annotations.","w":"Reading feedback like an examiner: what is a fix and what is a rethink.","c":"Extended 1:1 conference — section feedback.","wl":["nA2"],"cl":["lb12"],"k":["Write a revision plan before editing anything.","Rank changes by mark impact, not by ease.","Record the plan in the Decisions Log."],"g":"Decisions Log: the revision plan, dated.","r":["lb12","nA2","trk"],"s":"Return every section with a face-to-face conference this week. Written comments alone under-serve first-time project writers.","q":["All sections returned"],"video":null,"podcast":null},"21":{"p":"Unit 6","t":"Realisation and review","f":null,"l":"What 'finished' means for your particular project — and, if you are collecting primary data, the window opens now.","w":"Unit 6 Realisation and Review — what realisation means for a dissertation and for an artefact.","c":"1:1 conference — ethics sign-off for anyone collecting.","wl":["u6"],"cl":["u4"],"k":["Define what 'finished' looks like for your project, concretely.","Primary route: submit your ethics statement before collecting anything.","Secondary route: extend the Source Analysis Document to fifteen sources."],"g":"Ethics statement signed, if applicable.","r":["u6","u4","nDA","lb12"],"s":"No collection without a signed ethics statement. This is the one point where supervision is a gate rather than support.","q":["Ethics signed off"],"video":{"url":"https://www.youtube.com/watch?v=hrD3-s84Qhc","label":"Structuring the EPQ essay","by":"Mr Davey","title":"How to write your EPQ essay","mins":"4:48"},"podcast":null},"22":{"p":"Unit 6","t":"Synthesis, not summary","f":null,"l":"The single most useful session of the year: the difference between reporting your reading and arguing from it.","w":"6.1 Synthesis Not Summary — WEAK/STRONG pairs applied to your own paragraphs.","c":"1:1 conference.","wl":["s61"],"cl":["lb12"],"k":["Rewrite three summarising paragraphs as synthesising ones.","Find two sources that disagree and write the paragraph that holds them together.","Check every claim has a source and every source has a job."],"g":"Nothing new — but the log book should be current before the Easter brief.","r":["s61","u6","nA34"],"s":"Book a room with table space. This session works on paper and badly on screens.","q":[],"video":{"url":"https://www.youtube.com/watch?v=9hnIkyZrbos","label":"Combining sources, not listing them","by":"Academic Bites","title":"Synthesising: How to Combine Your Sources in Academic Writing","mins":"4:10"},"podcast":null},"23":{"p":"Writing","t":"Writing block 3 — analysis completed","f":null,"l":"The analysis reaches full length. From here the project is assembly rather than discovery.","w":"Argument architecture — each section answering part of the question.","c":"1:1 conference.","wl":["s61"],"cl":["nA34"],"k":["Complete the second analysis section.","Map each section to the part of the question it answers; cut what maps to nothing.","Update the monthly planning page for April."],"g":"Monthly planning page for April.","r":["s61","nA34"],"s":"The mapping exercise is where over-long Year 12 projects find their cuts. Do it in the room, not as homework.","q":[],"video":{"url":"https://www.youtube.com/watch?v=9hnIkyZrbos","label":"Combining sources, not listing them","by":"Academic Bites","title":"Synthesising: How to Combine Your Sources in Academic Writing","mins":"4:10"},"podcast":null},"24":{"p":"Review","t":"Progress review before Easter","f":"Term ends Thu 25 Mar","l":"Where the project stands with one term of Year 12 to go, and what the two-week break is for.","w":"Progress review clinic against the aims and objectives set in October.","c":"1:1 conference — progress review recorded.","wl":["s13"],"cl":["trk"],"k":["Tick off the objectives you have actually met and be honest about the rest.","Easter brief: draft the conclusion in outline, one sentence per move.","Read the two sources you have been avoiding."],"g":"Objectives reviewed and updated; supervisor conference record.","r":["lb12","trk","s13"],"s":"Issue the Easter brief in writing. Objectives that were never tickable should be rewritten now rather than quietly abandoned.","q":["Progress review recorded","Easter brief issued"],"video":{"url":"https://www.youtube.com/watch?v=4BTJL2GcXBc","label":"Deadlines and SMART objectives","by":"Martin Blyth","title":"EPQ Secrets: Time Management - Setting Deadlines and SMART targets","mins":"3:48"},"podcast":null},"25":{"p":"Writing","t":"Writing block 4 — the conclusion","f":null,"l":"Summer term. The conclusion answers the question you actually asked, not the one you wish you had.","w":"Conclusions that answer rather than summarise.","c":"1:1 conference.","wl":["s61"],"cl":["lb12"],"k":["Draft the conclusion in full.","Check the conclusion against the introduction — do they discuss the same question?","Note anything the conclusion promises that the analysis does not deliver."],"g":"Decisions Log: any gap between the introduction and the conclusion, and your plan for it.","r":["s61","u6"],"s":"The introduction–conclusion mismatch is the most common structural fault at this stage and the easiest to fix now.","q":[],"video":{"url":"https://www.youtube.com/watch?v=9hnIkyZrbos","label":"Combining sources, not listing them","by":"Academic Bites","title":"Synthesising: How to Combine Your Sources in Academic Writing","mins":"4:10"},"podcast":null},"26":{"p":"Draft","t":"Full working draft assembled","f":"Working draft due Fri 23 Apr","l":"Every section in one document, referenced, with contents. Not polished — complete.","w":"Assembly: contents, section transitions, consistent formatting.","c":"1:1 conference — draft handover.","wl":["s51"],"cl":["trk"],"k":["Assemble the complete document with contents and consistent formatting.","Run a full reference check before handing over.","Submit the working draft by Friday 23 April."],"g":"Log book current to the end of the drafting sections.","r":["nRF","s51","lb12"],"s":"Referral round 3 issued — the last of the year, and for Year 12 the most useful, because there is a real draft to ask about. Define 'full working draft': every section present, no placeholders.","q":["Referral round 3 issued","Drafts collected"],"video":{"url":"https://www.youtube.com/watch?v=lEgc9NV3_Gc","label":"Harvard referencing, step by step","by":"Digital Learning Consultant","title":"Simple Harvard Referencing Tutorial","mins":"6:08"},"podcast":null},"27":{"p":"Revision","t":"Draft feedback conferences","f":null,"l":"The whole draft comes back. Year 12 has the luxury the Year 13 June route does not: time to act on all of it.","w":"Reading whole-project feedback: structure before sentences.","c":"Extended 1:1 conference — full draft feedback.","wl":["nA34"],"cl":["lb12"],"k":["Write a revision plan before editing.","Deal with structural comments before sentence-level ones.","Record the plan in the Decisions Log."],"g":"Decisions Log: the revision plan, dated.","r":["lb12","trk","nA34"],"s":"Return every draft this week with a conference. This is the highest-value supervision point in the Year 12 year.","q":["All drafts returned"],"video":null,"podcast":null},"28":{"p":"Revision","t":"Revision block 1","f":"Bank holiday Mon 3 May","l":"Four-day week. Structural changes first, and the specialist feedback finally gets a written response.","w":"Revision clinic — structural changes.","c":"1:1 conference.","wl":["s61"],"cl":["lb12"],"k":["Work through the structural changes on the revision plan.","Record round 3 specialist feedback and what you decided in response.","Do not start new reading."],"g":"Specialist Feedback record: advice, decision, reasoning.","r":["lb12","nA34"],"s":"Short week — protect the conference session over the workshop if something has to give.","q":["Referral 3 recorded"],"video":{"url":"https://www.youtube.com/watch?v=9hnIkyZrbos","label":"Combining sources, not listing them","by":"Academic Bites","title":"Synthesising: How to Combine Your Sources in Academic Writing","mins":"4:10"},"podcast":null},"29":{"p":"Unit 6","t":"What realisation looks like","f":null,"l":"Revisiting Unit 6 with a real draft in hand makes it a different session from the one in February.","w":"Unit 6 Realisation and Review, revisited against your own draft.","c":"1:1 conference.","wl":["u6"],"cl":["lb12"],"k":["Audit the draft against the definition of 'finished' you wrote in March.","List what is genuinely outstanding, in priority order.","Update the monthly planning page for June."],"g":"Monthly planning page for June.","r":["u6","lb12"],"s":"Students who now disagree with their February definition of 'finished' are showing growth — record it as a decision rather than correcting it.","q":[],"video":{"url":"https://www.youtube.com/watch?v=hrD3-s84Qhc","label":"Structuring the EPQ essay","by":"Mr Davey","title":"How to write your EPQ essay","mins":"4:48"},"podcast":null},"30":{"p":"Revision","t":"Argument audit","f":null,"l":"One pass through the whole draft asking a single question of every paragraph: what is this doing?","w":"6.1 Synthesis Not Summary, applied as a whole-draft audit.","c":"1:1 conference.","wl":["s61"],"cl":["nA34"],"k":["Annotate every paragraph with its job in one phrase.","Cut or rewrite any paragraph whose job is 'shows I read this'.","Check every claim still has a source after the cuts."],"g":"Decisions Log: what you cut and why.","r":["s61","nA34"],"s":"Cutting is the hardest thing to teach and the most reliable mark-raiser. Model it on a shared paragraph first.","q":[],"video":{"url":"https://www.youtube.com/watch?v=9hnIkyZrbos","label":"Combining sources, not listing them","by":"Academic Bites","title":"Synthesising: How to Combine Your Sources in Academic Writing","mins":"4:10"},"podcast":null},"31":{"p":"Checkpoint","t":"End-of-year draft checkpoint","f":"Full draft + log book Fri 28 May","l":"The target the whole year has been aimed at: a full working draft and a log book complete to the end of the Mid Project Review sections.","w":"Final assembly time in the room.","c":"1:1 conference — checkpoint review.","wl":["lb12"],"cl":["trk"],"k":["Submit the revised full working draft.","Ensure the log book is complete to the end of the MPR sections.","Half term: rest. Nothing is set."],"g":"Log book complete to the end of the Mid Project Review sections.","r":["lb12","trk"],"s":"Log book check 4 of four. Record the checkpoint against the gate criteria that will decide next year's route — the September audit in Year 13 becomes a formality if this is done properly.","q":["Log book check 4","Checkpoint recorded"],"video":null,"podcast":null},"32":{"p":"AO4","t":"Evaluation, first draft","f":null,"l":"Twenty per cent of the marks, and the section that rewards the Decisions Log you have been keeping since September.","w":"6.3 Writing Evaluation That Scores — WEAK/STRONG pairs and the sentence stems.","c":"1:1 conference.","wl":["s63"],"cl":["lb12"],"k":["Draft the evaluation, 800–1,000 words, from the Decisions Log.","Build it around the five decisions that most changed the project.","Evaluate the method, not your feelings about the workload."],"g":"Evaluation draft in the log book.","r":["s63","nA34","lb12"],"s":"Students who kept the Decisions Log properly will find this straightforward; those who did not will discover why it mattered. Let them discover it.","q":[],"video":{"url":"https://www.youtube.com/watch?v=AwfWoqo3LhA","label":"Completing the evaluation","by":"Martin Blyth","title":"EPQ Secrets: Production Log Series - Completing the Evaluation","mins":"7:02"},"podcast":null},"33":{"p":"AO4","t":"Evaluation revision and
