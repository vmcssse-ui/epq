var el = function(id){ return document.getElementById(id); };
function esc(s){ return String(s == null ? "" : s).replace(/&/g,"&amp;").replace(/</g,"&lt;"); }
var L = M.meta.labels || {};
function lab(k, d){ return L[k] != null ? L[k] : d; }

/* ---------- theme: track accents + optional token overrides ---------- */
(function theme(){
  function vars(o){ return Object.keys(o || {}).map(function(k){ return "--" + k + ":" + o[k] + ";"; }).join(""); }
  function trackRules(prefix, dark){
    return M.tracks.map(function(t){
      var a = t.accent || {};
      var ink  = dark ? (a.inkDark  || a.ink)  : a.ink;
      var bg   = dark ? (a.bgDark   || a.bg)   : a.bg;
      var rule = dark ? (a.ruleDark || a.rule) : a.rule;
      return prefix + 'body[data-track="' + t.key + '"]{--track:' + ink +
             ";--track-bg:" + bg + ";--track-rule:" + rule + "}";
    }).join("\n");
  }
  var th = M.theme || {};
  var css = ":root{" + vars(th.light) + "}\n" + trackRules("", false) + "\n" +
    '@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){' + vars(th.dark) + "}\n" +
    trackRules(':root:not([data-theme="light"]) ', true) + "}\n" +
    ':root[data-theme="dark"]{' + vars(th.dark) + "}\n" +
    trackRules(':root[data-theme="dark"] ', true);
  var s = document.createElement("style");
  s.textContent = css;
  document.head.appendChild(s);
})();

/* ---------- file links ---------- */
var FI = M.files || {};
function encPath(p){ return p.split("/").map(encodeURIComponent).join("/"); }
function F(path){
  if (/^https?:/i.test(path)) return path;
  var ext = (path.split(".").pop() || "").toLowerCase();
  var office = (FI.officeExt || []).indexOf(ext) !== -1;
  return (FI.origin || "") + encPath((FI.prefix || "") + (FI.base || "") + path).replace(/^([^/])/, "/$1") +
         (office ? (FI.officeParam || "") : "");
}
function FOLDER(sub){
  if (!FI.folderView) return "#";
  var id = (FI.folderRoot || "") + (sub ? "/" + sub : "");
  return (FI.origin || "") + FI.folderView + encodeURIComponent(id);
}
var R = M.resources || {};

/* ---------- calendar ---------- */
var WC = M.calendar.weeks;
var LASTWEEK = WC.length;
var SHORT = M.calendar.shortWeeks || {};
var TERMS = M.calendar.terms || [];
var NOTES = M.calendar.notes || {};
var BREAKS = M.calendar.breaks || {};
var MN = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
function wcDate(n){ var p = WC[n-1].split("-"); return new Date(+p[0], +p[1]-1, +p[2]); }
function fmt(d){ return d.getDate() + " " + MN[d.getMonth()]; }
function wcLabel(n){
  var a = wcDate(n), b = new Date(a.getTime());
  b.setDate(b.getDate() + (SHORT[n] != null ? SHORT[n] : 4));
  return fmt(a) + " – " + fmt(b) + " " + b.getFullYear();
}

var state = { track: M.tracks[0].key, view: "stu" };

/* ---------- links ---------- */
function pageBase(){
  var u = M.meta.siteUrl;
  if (u) return u.split("#")[0];
  try { if (window.top !== window.self && window.top.location.href) return window.top.location.href.split("#")[0]; }
  catch(e){ if (document.referrer) return document.referrer.split("#")[0]; }
  return location.href.split("#")[0];
}
function weekURL(n){ return pageBase() + "#" + state.track + "-w" + n; }

function chip(id){
  var r = R[id]; if (!r) return "";
  return '<a class="chip" href="' + F(r.path) + '" target="_blank" rel="noopener">' + esc(r.label) +
         ' <span class="ext">' + esc(r.type) + "</span></a>";
}
function slink(ids){
  if (!ids || !ids.length) return "";
  return '<div class="slinks">' + ids.map(function(id){
    var r = R[id]; if (!r) return "";
    return '<a class="slink" href="' + F(r.path) + '" target="_blank" rel="noopener" title="' + esc(r.label) + '">' +
           '<span class="ar" aria-hidden="true">&#9656;</span>' + esc(r.short || r.label) + "</a>";
  }).join("") + "</div>";
}

/* ---------- media ---------- */
function ytEmbed(url){
  var m = /(?:youtu\.be\/|v=|\/embed\/|\/shorts\/)([A-Za-z0-9_-]{6,})/.exec(url || "");
  return m ? "https://www.youtube-nocookie.com/embed/" + m[1] + "?rel=0" : null;
}
function mbtn(kind, o, glyph, fallback){
  var mins = o.mins ? '<span class="mins">' + esc(o.mins) + "</span>" : "";
  var by = o.by ? '<span class="by">' + esc(o.by) + "</span>" : "";
  return '<button class="mbtn" type="button" aria-expanded="false" data-kind="' + kind +
         '" data-src="' + esc(o.url) + '" title="' + esc(o.title || o.label || fallback) + '">' +
         '<span class="gl" aria-hidden="true">' + glyph + "</span>" +
         esc(o.label || fallback) + by + mins + "</button>";
}
function media(d){
  var out = [];
  if (d.video && d.video.url)   out.push(mbtn("video", d.video, "&#9654;", lab("watch","Watch")));
  if (d.podcast && d.podcast.url) out.push(mbtn("audio", d.podcast, "&#9835;", lab("listen","Listen")));
  if (!out.length) return "";
  return '<div class="media">' + out.join("") + '</div><div class="mstage" hidden></div>';
}
document.addEventListener("click", function(e){
  var b = e.target.closest && e.target.closest(".mbtn");
  if (!b) return;
  var stage = b.parentNode.nextElementSibling;
  if (!stage || !stage.classList.contains("mstage")) return;
  var open = b.getAttribute("aria-expanded") === "true";
  Array.prototype.forEach.call(b.parentNode.querySelectorAll(".mbtn"), function(x){
    x.setAttribute("aria-expanded", "false");
  });
  if (open){ stage.hidden = true; stage.innerHTML = ""; return; }
  var src = b.getAttribute("data-src");
  if (b.getAttribute("data-kind") === "video"){
    var emb = ytEmbed(src) || src;
    stage.innerHTML = '<div class="frame"><iframe src="' + esc(emb) +
      '" title="Video" allow="accelerometer; clipboard-write; encrypted-media; picture-in-picture" ' +
      'referrerpolicy="strict-origin-when-cross-origin" allowfullscreen loading="lazy"></iframe></div>';
  } else {
    stage.innerHTML = '<audio controls preload="none" src="' + esc(/^https?:/i.test(src) ? src : F(src)) + '"></audio>';
  }
  stage.hidden = false;
  b.setAttribute("aria-expanded", "true");
});

/* ---------- week card ---------- */
function weekHTML(n, d){
  var flag = d.f ? '<span class="flag">' + esc(d.f) + "</span>" : "";
  var note = NOTES[n] ? '<div class="note">' + esc(NOTES[n]) + "</div>" : "";
  var tasks = (d.k || []).map(function(t, i){
    var key = "wk:" + M.meta.id + ":" + state.track + ":" + n + ":" + i;
    return '<li data-key="' + key + '"><input type="checkbox" id="' + key + '"><label for="' + key + '">' + esc(t) + "</label></li>";
  }).join("");
  var used = (d.wl || []).concat(d.cl || []);
  var extra = (d.r || []).filter(function(id){ return used.indexOf(id) === -1; });
  var links = extra.length
    ? '<div class="subhead">' + esc(lab("also","Also this week")) + '</div><div class="links">' + extra.map(chip).join("") + "</div>"
    : "";
  var qa = (d.q && d.q.length)
    ? '<div class="qa">' + d.q.map(function(x){ return "<span>" + esc(x) + "</span>"; }).join("") + "</div>" : "";
  var supBlock = d.s
    ? '<div class="sup"><div class="subhead">' + esc(lab("supervisor","Supervisor")) + "</div><p>" + esc(d.s) + "</p>" + qa + "</div>"
    : "";
  return '<article class="wk' + (d.f ? " deadline" : "") + '" id="w' + n + '"><div class="inner">' +
    '<div class="idx"><div class="num">' + esc(lab("weekWord","Week")) + " " + n + "</div>" +
      '<div class="date">' + fmt(wcDate(n)) + "</div>" +
      '<div class="days">' + wcLabel(n) + "</div>" + note +
      '<button class="wlink" data-w="' + n + '">' + esc(lab("copyLink","Copy week link")) + "</button>" +
      '<input class="wurl" readonly value="' + weekURL(n) + '" aria-label="Link to week ' + n + '">' +
    "</div>" +
    '<div class="body">' +
      '<span class="phase">' + esc(d.p) + "</span>" + flag +
      '<h4 class="wt">' + esc(d.t) + "</h4>" +
      '<p class="lede">' + esc(d.l) + "</p>" +
      '<dl class="slots">' +
        '<div class="slot"><dt>' + esc(lab("slotA","Session A")) + "</dt><dd>" + esc(d.w) + "</dd>" + slink(d.wl) + "</div>" +
        '<div class="slot"><dt>' + esc(lab("slotB","Session B")) + "</dt><dd>" + esc(d.c) + "</dd>" + slink(d.cl) + "</div>" +
      "</dl>" +
      media(d) +
      '<div class="subhead">' + esc(lab("tasks","Before the next session")) + "</div>" +
      '<ul class="tasks">' + tasks + "</ul>" +
      (d.g ? '<div class="logbox"><b>' + esc(lab("logbook","Log book")) + ":</b> " + esc(d.g) + "</div>" : "") +
      links + supBlock +
    "</div></div></article>";
}

function breakHTML(b){
  return '<div class="brk' + (b.warn ? " warn" : "") + '"><span class="lbl">' + esc(b.lbl) + "</span>" +
    '<span class="dt">' + esc(b.dt) + "</span>" +
    (b.msg ? '<span class="msg">' + esc(b.msg) + "</span>" : "") + "</div>";
}

function trackByKey(k){
  for (var i = 0; i < M.tracks.length; i++) if (M.tracks[i].key === k) return M.tracks[i];
  return M.tracks[0];
}

function render(){
  var t = state.track, D = M.weeks[t] || {}, route = trackByKey(t);
  document.body.setAttribute("data-track", t);
  document.body.setAttribute("data-view", state.view);
  el("introTitle").textContent = route.name;
  el("introText").textContent = route.blurb;
  el("introSpine").innerHTML = (route.spine || []).map(function(r){
    return '<div class="row"><span class="k">' + esc(r[0]) + '</span><span class="v">' + esc(r[1]) + "</span></div>";
  }).join("");

  var out = [], keys = Object.keys(D).map(Number);
  var lastWeek = keys.length ? Math.max.apply(null, keys) : 0;
  TERMS.forEach(function(T){
    var body = [];
    for (var n = T.from; n <= T.to; n++){
      if (D[n]) body.push(weekHTML(n, D[n]));
      if (BREAKS[n] && n <= lastWeek) body.push(breakHTML(BREAKS[n]));
    }
    if (body.length) out.push('<div class="termhead"><h3>' + esc(T.t) + '</h3><span class="line"></span></div>' + body.join(""));
  });

  if (lastWeek && lastWeek < LASTWEEK){
    var title = lab("endcapTitle", "Weeks %A%–%B% · nothing scheduled")
      .replace("%A%", lastWeek + 1).replace("%B%", LASTWEEK).replace("%L%", lastWeek);
    var bodyTxt = lab("endcapBody", "This track finishes in week %L%.").replace("%L%", lastWeek)
      .replace("%A%", lastWeek + 1).replace("%B%", LASTWEEK);
    var pts = (lab("endcapPoints", []) || []).map(function(p){ return "<li>" + esc(p) + "</li>"; }).join("");
    out.push('<div class="endcap"><h4>' + esc(title) + "</h4><p>" + esc(bodyTxt) + "</p>" +
             (pts ? "<ul>" + pts + "</ul>" : "") + "</div>");
  }
  el("weeks").innerHTML = out.join("");
  restore();
}

/* ---------- task persistence ---------- */
function store(k, v){ try { if (v) localStorage.setItem(k, "1"); else localStorage.removeItem(k); } catch(e){} }
function restore(){
  var boxes = document.querySelectorAll(".tasks input");
  Array.prototype.forEach.call(boxes, function(b){
    var on = false;
    try { on = localStorage.getItem(b.id) === "1"; } catch(e){}
    b.checked = on;
    b.parentNode.classList.toggle("checked", on);
  });
  meter();
}
function meter(){
  var boxes = document.querySelectorAll(".tasks input"), done = 0;
  Array.prototype.forEach.call(boxes, function(b){ if (b.checked) done++; });
  el("mcount").textContent = done + " / " + boxes.length;
  el("mfill").style.width = Math.round(done / (boxes.length || 1) * 100) + "%";
}
document.addEventListener("change", function(e){
  if (e.target && e.target.matches(".tasks input")){
    e.target.parentNode.classList.toggle("checked", e.target.checked);
    store(e.target.id, e.target.checked);
    meter();
  }
});

/* ---------- deep links ---------- */
function selectTab(t){
  Array.prototype.forEach.call(document.querySelectorAll(".tab"), function(x){
    x.setAttribute("aria-selected", x.getAttribute("data-t") === t ? "true" : "false");
  });
  state.track = t;
}
function jumpTo(n, smooth){
  var node = el("w" + n);
  if (!node) return;
  node.scrollIntoView({ behavior: smooth ? "smooth" : "auto", block: "start" });
  node.classList.add("flash");
  setTimeout(function(){ node.classList.remove("flash"); }, 2600);
}
var TRACKRE = new RegExp("^#?(" + M.tracks.map(function(t){ return t.key; }).join("|") + ")(?:-w(\\d+))?$");
function routeFromHash(smooth){
  var m = TRACKRE.exec((location.hash || "").trim());
  if (!m) return false;
  selectTab(m[1]);
  render();
  if (m[2]){
    var n = parseInt(m[2], 10);
    var go = function(){ jumpTo(n, false); };
    setTimeout(function(){ jumpTo(n, !!smooth); }, 30);
    /* Web fonts land after first paint and reflow the page, which drags the
       target away from the viewport — re-anchor once they are ready. */
    if (document.fonts && document.fonts.ready) document.fonts.ready.then(go);
    window.addEventListener("load", function(){ setTimeout(go, 80); }, { once: true });
  }
  else window.scrollTo({ top: 0 });
  return true;
}
try { if ("scrollRestoration" in history) history.scrollRestoration = "manual"; } catch(e){}
window.addEventListener("hashchange", function(){ routeFromHash(true); });

document.addEventListener("click", function(e){
  var b = e.target.closest && e.target.closest(".wlink");
  if (!b) return;
  var field = b.parentNode.querySelector(".wurl");
  var url = weekURL(b.getAttribute("data-w"));
  field.value = url;
  field.classList.add("show");
  field.focus(); field.select();
  var ok = false;
  try { document.execCommand("copy"); ok = true; } catch(err){}
  var done = function(good){
    b.textContent = good ? lab("copied","Link copied") : lab("copyManual","Copy from the box");
    b.setAttribute("data-done", "1");
  };
  if (navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(url).then(function(){ done(true); }, function(){ done(ok); });
  } else done(ok);
  setTimeout(function(){ b.textContent = lab("copyLink","Copy week link"); b.removeAttribute("data-done"); }, 4000);
});

(function chrome(){

  el("crest").innerHTML = (m.eyebrow || []).map(function(x, i){
    return i === 0 ? "<b>" + esc(x) + "</b>" : "<span>·</span> <span>" + esc(x) + "</span>";

  el("foot").innerHTML = (m.footer || []).map(function(x){ return "<span>" + esc(x) + "</span>"; }).join("\n");

  var lib = M.library || {};
  el("libTitle").textContent = lab("libraryTitle","Where everything lives");
  if (lib.lede || L.libraryLede) el("libLede").innerHTML = lib.lede || L.libraryLede; else el("libLede").remove();
  var shelves = (lib.shelves || []).map(function(s){
    return '<div class="shelf"><h5>' + esc(s[0]) + "</h5><ul>" + s[1].map(function(id){
      var r = R[id]; if (!r) return "";
      return '<li><a href="' + F(r.path) + '" target="_blank" rel="noopener">' + esc(r.label) +
             '<span class="t">' + esc(r.type) + "</span></a></li>";
    }).join("") + "</ul></div>";
  });
  if ((lib.folders || []).length){
    shelves.push('<div class="shelf"><h5>Folders</h5><ul>' + lib.folders.map(function(f){
      return '<li><a href="' + FOLDER(f[1]) + '" target="_blank" rel="noopener">' + esc(f[0]) +
             '<span class="t">' + esc(f[2] || "FOLDER") + "</span></a></li>";
    }).join("") + "</ul></div>");
  }
  el("shelves").innerHTML = shelves.join("");
  if (lib.gaps){
    el("gapBox").innerHTML = "<b>" + esc(lab("gapsLabel","Not available yet:")) + "</b> " + esc(lib.gaps);
    el("gapBox").hidden = false;
  }
  if (!(lib.shelves || []).length && !(lib.folders || []).length && !lib.gaps){
    document.querySelector(".lib").remove();
  }
})();

function setView(v){
  state.view = v;
  el("vStu").setAttribute("aria-pressed", v === "stu");
  el("vSup").setAttribute("aria-pressed", v === "sup");
  document.body.setAttribute("data-view", v);
}
el("vStu").addEventListener("click", function(){ setView("stu"); });
el("vSup").addEventListener("click", function(){ setView("sup"); });

el("today").addEventListener("click", function(){
  var now = new Date(), best = null;
  for (var n = 1; n <= LASTWEEK; n++){
    var a = wcDate(n), b = new Date(a.getTime()); b.setDate(b.getDate() + 7);
    if (now >= a && now < b){ best = n; break; }
    if (now < a){ best = n; break; }
  }
  if (!best) best = LASTWEEK;
  var node = el("w" + best);
  while (!node && best > 1){ best--; node = el("w" + best); }
  if (node) node.scrollIntoView({ behavior: "smooth", block: "start" });
});

if (!routeFromHash(false)) render();
})();
</script>
</body>
