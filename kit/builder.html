<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Weekly Page Builder</title>
<style>
:root{
  --bg:#FBF7EE; --surface:#FFFFFF; --surface-2:#F4EFE2; --surface-3:#EDE6D5;
  --ink:#1A2333; --ink-2:#48536A; --ink-3:#7C859A;
  --rule:#E3DAC6; --rule-2:#CEC3A8; --navy:#12294D; --gold:#C9A227; --gold-ink:#8A6D12;
  --ok:#2C6349; --bad:#A62016; --bad-bg:#FAEAE7;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 "Source Sans 3","Segoe UI",system-ui,sans-serif}
h1{font-family:Georgia,serif;font-weight:500;font-size:22px;margin:0}
h2{font-family:Georgia,serif;font-weight:600;font-size:19px;margin:0 0 4px}
h3{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-3);margin:22px 0 8px;font-weight:700}
code,.mono{font-family:ui-monospace,"SF Mono",Menlo,monospace}

header{display:flex;align-items:center;gap:16px;padding:12px 20px;background:var(--surface-2);
  border-bottom:2px solid var(--rule-2);position:sticky;top:0;z-index:20;flex-wrap:wrap}
header .sp{flex:1}
.badge{font:600 11px/1 ui-monospace,monospace;letter-spacing:.1em;text-transform:uppercase;
  padding:5px 8px;border:2px solid var(--rule-2);border-radius:2px;color:var(--ink-3)}
.badge.ok{color:var(--ok);border-color:var(--ok)}
.badge.bad{color:var(--bad);border-color:var(--bad);background:var(--bad-bg)}

button,.filebtn{appearance:none;font:inherit;font-size:13px;font-weight:600;cursor:pointer;
  border:2px solid var(--rule-2);background:var(--surface);color:var(--ink-2);
  border-radius:2px;padding:7px 12px;display:inline-flex;align-items:center;gap:6px}
button:hover,.filebtn:hover{background:var(--surface-2)}
button.primary{background:var(--navy);border-color:var(--navy);color:#fff}
button.primary:hover{filter:brightness(1.15)}
button.small{padding:4px 8px;font-size:12px}
button.danger{color:var(--bad);border-color:var(--bad)}
input[type=file]{display:none}

.shell{display:grid;grid-template-columns:186px minmax(0,1fr) minmax(0,1fr);gap:0;
  height:calc(100vh - 57px)}
nav{border-right:2px solid var(--rule-2);background:var(--surface-2);padding:14px 0;overflow:auto}
nav button{display:block;width:100%;text-align:left;border:0;background:transparent;border-radius:0;
  padding:9px 18px;color:var(--ink-2)}
nav button[aria-current="true"]{background:var(--surface);color:var(--navy);
  box-shadow:inset 3px 0 0 var(--gold)}
.panel{overflow:auto;padding:20px 22px 60px;border-right:2px solid var(--rule-2)}
.preview{display:flex;flex-direction:column;background:var(--surface-3)}
.preview .ptools{display:flex;gap:8px;align-items:center;padding:8px 12px;
  border-bottom:2px solid var(--rule-2);background:var(--surface-2)}
.preview iframe{flex:1;width:100%;border:0;background:#fff}

label{display:block;font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;
  color:var(--ink-3);margin:0 0 4px}
input[type=text],input[type=url],input[type=date],textarea,select{
  width:100%;font:inherit;font-size:14px;padding:7px 9px;border:2px solid var(--rule-2);
  border-radius:2px;background:var(--surface);color:var(--ink)}
textarea{resize:vertical;min-height:64px;line-height:1.45}
.field{margin-bottom:13px}
.row{display:grid;gap:10px}
.row.two{grid-template-columns:1fr 1fr}
.row.three{grid-template-columns:1fr 1fr 1fr}
.row.four{grid-template-columns:1fr 1fr 1fr 1fr}
.help{font-size:12.5px;color:var(--ink-3);margin:-2px 0 9px;line-height:1.45}
.card{border:2px solid var(--rule-2);border-radius:3px;padding:12px 14px;margin-bottom:10px;background:var(--surface)}
.card .hd{display:flex;align-items:center;gap:8px;margin-bottom:9px}
.card .hd strong{font-size:14px}
.card .hd .sp{flex:1}
.swatch{width:20px;height:20px;border-radius:3px;border:2px solid var(--rule-2);flex:none}
table{width:100%;border-collapse:collapse;font-size:13px}
th{text-align:left;font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3);
  padding:5px 6px;border-bottom:2px solid var(--rule-2)}
td{padding:3px 6px;border-bottom:1px solid var(--rule)}
td input{padding:4px 6px;font-size:13px}
.problems{border:2px solid var(--bad);background:var(--bad-bg);border-radius:3px;padding:10px 13px;
  margin-bottom:14px;font-size:13.5px;color:var(--bad)}
.problems ul{margin:6px 0 0;padding-left:18px}
.wknav{display:flex;flex-wrap:wrap;gap:4px;margin-bottom:12px}
.wknav button{padding:3px 8px;font-size:12px;font-family:ui-monospace,monospace}
.wknav button[aria-current="true"]{background:var(--navy);color:#fff;border-color:var(--navy)}
.wknav button.has{border-color:var(--ok);color:var(--ok)}
.wknav button.has[aria-current="true"]{color:#fff}
.pill{font:600 10.5px/1 ui-monospace,monospace;letter-spacing:.08em;text-transform:uppercase;
  padding:3px 6px;border:2px solid var(--rule-2);border-radius:2px;color:var(--ink-3)}
.hidden{display:none!important}
@media (max-width:1100px){ .shell{grid-template-columns:150px 1fr} .preview{display:none} }
</style>
</head>
<body>

<header>
  <h1>Weekly Page Builder</h1>
  <span class="badge" id="tplBadge">template —</span>
  <span class="badge" id="statBadge">no manifest</span>
  <span class="sp"></span>
  <label class="filebtn" for="loadFile">Load manifest…</label>
  <input type="file" id="loadFile" accept=".json,application/json">
  <button id="btnSkeleton">Start blank</button>
  <button id="btnManifest">Download manifest</button>
  <button class="primary" id="btnHtml">Download page</button>
</header>

<div class="shell">
  <nav id="nav">
    <button data-p="meta" aria-current="true">Page</button>
    <button data-p="calendar">Calendar</button>
    <button data-p="tracks">Tracks</button>
    <button data-p="resources">Resources</button>
    <button data-p="weeks">Weeks</button>
    <button data-p="library">Library</button>
    <button data-p="json">JSON</button>
  </nav>

  <div class="panel" id="panel"></div>

  <div class="preview">
    <div class="ptools">
      <button class="small" id="btnPreview">Refresh preview</button>
      <span class="sp" style="flex:1"></span>
      <span class="badge" id="prevBadge">—</span>
    </div>
    <iframe id="frame" title="Preview" sandbox="allow-scripts allow-same-origin"></iframe>
  </div>
</div>

<script src="template.js"></script>
<script src="builder.js"></script>
</body>
</html>
